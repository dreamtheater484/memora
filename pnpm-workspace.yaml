packages:
  - apps/*
  - packages/*

# pnpm 10 does not run dependency install scripts unless they are listed here.
onlyBuiltDependencies:
  - esbuild

ignoredBuiltDependencies:
  # Ships prebuilt binaries for every platform we support and loads them first.
  # Its build script would only compile an unused copy, which needs a C++ toolchain.
  - better-sqlite3
  # Git hooks are installed by scripts/install-hooks.mjs instead (skipped in CI and Docker builds).
  - lefthook
  # The desktop app (apps/desktop): electron-builder downloads Electron itself when it packages
  # the app, and makes the Windows installer with NSIS, not Squirrel.
  - electron
  - electron-winstaller

# Patched versions of transitive dependencies with published advisories (`pnpm audit`).
overrides:
  # Through mermaid > chevrotain: GHSA-r5fr-rjxr-66jc, GHSA-f23m-r3pf-42rh.
  lodash-es: ^4.18.1

# Fixes applied to dependencies as they are installed (`pnpm patch`). Each patch is tied to the
# exact version: upgrading the package means checking whether the fix is still needed.
patchedDependencies:
  # SVG text labels (flowcharts, mind maps) showed `&quot;` and `&#35;` as written: the
  # entity reader only knew &amp; &lt; &gt; (patches/mermaid-12.0.0.patch).
  mermaid@12.0.0: patches/mermaid-12.0.0.patch
