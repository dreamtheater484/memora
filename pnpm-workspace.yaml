packages:
  - apps/*
  - packages/*

# pnpm 10 does not run dependency install scripts unless they are listed here.
# better-sqlite3 needs its script to fetch (or build) the native SQLite binding.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

# Git hooks are installed by scripts/install-hooks.mjs instead (skipped in CI and Docker builds).
ignoredBuiltDependencies:
  - lefthook
