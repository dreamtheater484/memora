<title>Memora design directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
/>
<style>
  /* ================= Review chrome (neutral, not part of any direction) ================= */
  :root {
    color-scheme: light;
    --rv-bg: #e3e4e7;
    --rv-bar: #fafafb;
    --rv-text: #1b1c1f;
    --rv-muted: #62666d;
    --rv-line: #d4d6db;
    --rv-seg: #ebedf0;
    --rv-on: #1b1c1f;
    --rv-on-text: #ffffff;
    --rv-focus: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      color-scheme: dark;
      --rv-bg: #070809;
      --rv-bar: #121316;
      --rv-text: #e6e7ea;
      --rv-muted: #8b8f97;
      --rv-line: #24262b;
      --rv-seg: #1c1e22;
      --rv-on: #e6e7ea;
      --rv-on-text: #111214;
      --rv-focus: #7aa2ff;
    }
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --rv-bg: #070809;
    --rv-bar: #121316;
    --rv-text: #e6e7ea;
    --rv-muted: #8b8f97;
    --rv-line: #24262b;
    --rv-seg: #1c1e22;
    --rv-on: #e6e7ea;
    --rv-on-text: #111214;
    --rv-focus: #7aa2ff;
  }
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }
  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--rv-bg);
    color: var(--rv-text);
    font:
      14px/1.4 system-ui,
      -apple-system,
      'Segoe UI',
      Roboto,
      sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  button,
  input {
    font: inherit;
    color: inherit;
  }
  button {
    cursor: pointer;
  }
  .i {
    width: 16px;
    height: 16px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    vertical-align: middle;
  }

  .rv {
    flex: none;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 18px;
    padding: calc(8px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px
      max(16px, env(safe-area-inset-left));
    background: var(--rv-bar);
    border-bottom: 1px solid var(--rv-line);
    position: relative;
    z-index: 5;
  }
  .rv-brand {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }
  .rv-brand b {
    font-size: 14px;
  }
  .rv-brand span {
    font-size: 12px;
    color: var(--rv-muted);
  }
  .rv-controls {
    display: flex;
    gap: 8px;
    min-width: 0;
    flex: 1 1 auto;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .rv-controls::-webkit-scrollbar {
    display: none;
  }
  .seg {
    display: inline-flex;
    flex: none;
    gap: 2px;
    padding: 3px;
    border-radius: 9px;
    background: var(--rv-seg);
  }
  .seg button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 0;
    background: transparent;
    padding: 6px 10px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
    color: var(--rv-muted);
    white-space: nowrap;
  }
  .seg button:hover {
    color: var(--rv-text);
  }
  .seg button[aria-pressed='true'] {
    background: var(--rv-on);
    color: var(--rv-on-text);
  }
  .seg button:focus-visible {
    outline: 2px solid var(--rv-focus);
    outline-offset: 1px;
  }
  .seg .i {
    width: 15px;
    height: 15px;
  }
  .rv-note {
    flex-basis: 100%;
    margin: 0;
    font-size: 12.5px;
    color: var(--rv-muted);
  }
  .rv-note b {
    color: var(--rv-text);
    font-weight: 600;
  }
  .rv-note .try {
    display: block;
    margin-top: 2px;
  }
  @media (max-width: 760px) {
    .rv-brand,
    .rv-note,
    .seg[data-key='device'],
    .rv .wide {
      display: none;
    }
    .rv {
      padding-top: calc(6px + env(safe-area-inset-top));
      padding-bottom: 6px;
    }
    .seg button {
      padding: 6px 9px;
    }
  }

  .stage {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }
  .frame.fit {
    position: absolute;
    inset: 0;
  }
  .frame.fit .device {
    width: 100%;
    height: 100%;
  }
  .frame.framed {
    position: absolute;
    left: 50%;
    top: 50%;
    translate: -50% -50%;
  }
  .frame.framed .device {
    transform-origin: 0 0;
    border-radius: 12px;
    box-shadow:
      0 0 0 1px var(--rv-line),
      0 30px 80px -24px rgb(0 0 0 / 0.35);
  }
  .frame.framed[data-device='phone'] .device {
    border-radius: 40px;
    box-shadow:
      0 0 0 10px #101113,
      0 0 0 11px #2c2e33,
      0 30px 80px -20px rgb(0 0 0 / 0.5);
  }
  .frame-cap {
    position: absolute;
    right: 14px;
    bottom: 6px;
    font-size: 11.5px;
    color: var(--rv-muted);
    pointer-events: none;
  }

  /* ================= Device + direction tokens ================= */
  @property --ah {
    syntax: '<number>';
    inherits: true;
    initial-value: 255;
  }
  .device {
    --safe-b: 0px;
    position: relative;
    overflow: hidden;
    container: app / inline-size;
    isolation: isolate;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.45;
  }
  .frame.fit .device {
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  .app {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .hue {
    --sec: light-dark(oklch(0.64 0.15 var(--h)), oklch(0.74 0.13 var(--h)));
    --sec-strong: light-dark(oklch(0.52 0.16 var(--h)), oklch(0.8 0.12 var(--h)));
    --sec-soft: light-dark(oklch(0.95 0.035 var(--h)), oklch(0.3 0.05 var(--h)));
    --sec-softer: light-dark(oklch(0.977 0.015 var(--h)), oklch(0.225 0.018 var(--h)));
    --sec-ink: light-dark(oklch(0.4 0.11 var(--h)), oklch(0.88 0.07 var(--h)));
  }
  .hue.neutral {
    --sec: light-dark(#7d8592, #9aa2ae);
    --sec-strong: light-dark(#5d6571, #b5bcc6);
    --sec-soft: light-dark(#eceef1, #2a2d32);
    --sec-softer: light-dark(#f5f6f8, #212327);
    --sec-ink: light-dark(#434a55, #d3d8df);
  }

  /* ----- A · Ink: quiet paper and ink, highlighter accent ----- */
  .device[data-dir='ink'] {
    --font-ui: 'Geist', system-ui, sans-serif;
    --font-display: 'Geist', system-ui, sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, monospace;
    --bg: light-dark(#f1f2ef, #0e0f10);
    --panel: light-dark(#f1f2ef, #0e0f10);
    --surface: light-dark(#ffffff, #161719);
    --raised: light-dark(#ffffff, #1c1d20);
    --line: light-dark(#e0e1dd, #232528);
    --line-strong: light-dark(#cacbc6, #34363a);
    --text: light-dark(#131517, #ebece9);
    --text-2: light-dark(#565a60, #a0a3a8);
    --text-3: light-dark(#878b90, #6a6e74);
    --hover: light-dark(rgb(19 21 23 / 0.05), rgb(235 236 233 / 0.06));
    --active-bg: light-dark(#e3e5df, #1f2123);
    --accent: light-dark(#131517, #ebece9);
    --accent-ink: light-dark(#ffffff, #0e0f10);
    --mark: light-dark(#d4f54f, #c3ea3b);
    --mark-soft: light-dark(#e6fa92, rgb(195 234 59 / 0.3));
    --focus: light-dark(#131517, #c3ea3b);
    --radius: 10px;
    --radius-sm: 7px;
    --radius-lg: 14px;
    --shadow-card: 0 0 0 transparent;
    --shadow-pop: 0 1px 2px rgb(0 0 0 / 0.06), 0 16px 40px -10px rgb(0 0 0 / 0.28);
    --ok: light-dark(#2f7a4c, #6fd39a);
    --warn: light-dark(#9a6200, #f0b646);
    --danger: light-dark(#bf3a2d, #ff7d70);
    --code-bg: light-dark(#fbfbfa, #121315);
    --gutter-bg: transparent;
    --cur-line: light-dark(#f5f9e4, #1c1f16);
    --col-bg: light-dark(#eef0ec, #131416);
    --card-bg: light-dark(#ffffff, #1b1c1f);
    --sel-bg: light-dark(#eef6cc, #252b15);
    --syn-h: light-dark(#131517, #ffffff);
    --syn-punct: light-dark(#a6a9a3, #55595e);
    --syn-link: light-dark(#4b7a0a, #c3ea3b);
    --syn-code: light-dark(#9a3d12, #f3a676);
    --syn-task: light-dark(#2456c9, #8fb4ff);
    --syn-meta: light-dark(#6f5f99, #b7a6e0);
    --syn-quote: light-dark(#5f6e64, #98a89d);
    --syn-tag: light-dark(#0f7866, #6ee0c8);
    --syn-kw: light-dark(#8a2da8, #e39cf5);
    --syn-str: light-dark(#2f7a4c, #9be3b0);
    --tb-bg: var(--bg);
    --tb-text: var(--text);
    --tb-muted: var(--text-2);
    --tb-field: var(--surface);
    --tb-line: var(--line);
    --tb-hover: var(--hover);
    --logo-b: var(--text);
    --logo-t1: var(--mark);
    --logo-t2: var(--text-3);
    --logo-m: var(--bg);
  }

  /* ----- B · Aurora: frosted panels over an ambient glow in the section colour ----- */
  .device[data-dir='aurora'] {
    --font-ui: 'Figtree', system-ui, sans-serif;
    --font-display: 'Bricolage Grotesque', 'Figtree', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --bg: light-dark(#eef0f6, #0b0c12);
    --panel: light-dark(rgb(255 255 255 / 0.5), rgb(26 28 40 / 0.5));
    --surface: light-dark(rgb(255 255 255 / 0.8), rgb(20 22 31 / 0.74));
    --raised: light-dark(rgb(255 255 255 / 0.86), rgb(32 34 47 / 0.86));
    --line: light-dark(rgb(30 34 60 / 0.09), rgb(255 255 255 / 0.08));
    --line-strong: light-dark(rgb(30 34 60 / 0.16), rgb(255 255 255 / 0.15));
    --text: light-dark(#171923, #eef0f7);
    --text-2: light-dark(#535869, #a9aec0);
    --text-3: light-dark(#868b9c, #6f7488);
    --hover: light-dark(rgb(30 34 60 / 0.05), rgb(255 255 255 / 0.06));
    --active-bg: light-dark(rgb(255 255 255 / 0.92), rgb(255 255 255 / 0.1));
    --accent: light-dark(oklch(0.55 0.17 var(--ah)), oklch(0.78 0.13 var(--ah)));
    --accent-ink: light-dark(#ffffff, #0b0c12);
    --mark: var(--accent);
    --mark-soft: light-dark(oklch(0.9 0.08 var(--ah)), oklch(0.42 0.1 var(--ah) / 0.8));
    --focus: var(--accent);
    --radius: 14px;
    --radius-sm: 9px;
    --radius-lg: 20px;
    --glass-hi: light-dark(rgb(255 255 255 / 0.8), rgb(255 255 255 / 0.07));
    --glass-sh: light-dark(rgb(40 44 90 / 0.13), rgb(0 0 0 / 0.45));
    --shadow-card: 0 1px 2px var(--glass-sh), 0 4px 14px -6px var(--glass-sh);
    --shadow-pop: 0 24px 60px -12px light-dark(rgb(20 24 60 / 0.3), rgb(0 0 0 / 0.7));
    --ok: light-dark(#23845a, #6ee7a8);
    --warn: light-dark(#a15c00, #f7bf5a);
    --danger: light-dark(#c4314b, #ff8197);
    --code-bg: light-dark(rgb(248 249 253 / 0.65), rgb(8 9 16 / 0.4));
    --gutter-bg: transparent;
    --cur-line: light-dark(oklch(0.96 0.03 var(--ah) / 0.8), oklch(0.3 0.05 var(--ah) / 0.45));
    --col-bg: light-dark(rgb(255 255 255 / 0.4), rgb(255 255 255 / 0.035));
    --card-bg: light-dark(rgb(255 255 255 / 0.94), rgb(36 39 53 / 0.9));
    --sel-bg: light-dark(oklch(0.94 0.04 var(--ah)), oklch(0.33 0.06 var(--ah)));
    --syn-h: var(--accent);
    --syn-punct: light-dark(#a3a7b6, #555a6e);
    --syn-link: light-dark(oklch(0.52 0.15 calc(var(--ah) + 70)), oklch(0.8 0.12 calc(var(--ah) + 70)));
    --syn-code: light-dark(#b0306a, #ff9ac6);
    --syn-task: light-dark(#23845a, #6ee7a8);
    --syn-meta: light-dark(#7a6fb0, #b9b0ee);
    --syn-quote: var(--text-2);
    --syn-tag: light-dark(oklch(0.5 0.14 calc(var(--ah) - 60)), oklch(0.8 0.12 calc(var(--ah) - 60)));
    --syn-kw: light-dark(#8a3ab9, #d7a4ff);
    --syn-str: light-dark(#23845a, #8ef0bd);
    --tb-bg: transparent;
    --tb-text: var(--text);
    --tb-muted: var(--text-2);
    --tb-field: var(--panel);
    --tb-line: var(--glass-hi);
    --tb-hover: var(--hover);
    --logo-b: var(--accent);
    --logo-t1: light-dark(oklch(0.78 0.13 calc(var(--ah) + 60)), oklch(0.66 0.13 calc(var(--ah) + 60)));
    --logo-t2: light-dark(oklch(0.84 0.1 calc(var(--ah) - 50)), oklch(0.58 0.1 calc(var(--ah) - 50)));
    --logo-m: var(--accent-ink);
    transition: --ah 0.9s ease;
    background:
      radial-gradient(
        60% 55% at 6% 0%,
        light-dark(oklch(0.86 0.1 var(--ah) / 0.95), oklch(0.36 0.12 var(--ah) / 0.6)),
        transparent 72%
      ),
      radial-gradient(
        50% 60% at 100% 6%,
        light-dark(oklch(0.88 0.09 calc(var(--ah) + 50) / 0.85), oklch(0.32 0.1 calc(var(--ah) + 50) / 0.5)),
        transparent 72%
      ),
      radial-gradient(
        70% 60% at 55% 110%,
        light-dark(oklch(0.9 0.08 calc(var(--ah) - 45) / 0.9), oklch(0.3 0.09 calc(var(--ah) - 45) / 0.5)),
        transparent 72%
      ),
      var(--bg);
  }

  /* ----- C · Spectrum: OneNote evolved, bold colour coding ----- */
  .device[data-dir='spectrum'] {
    --font-ui: 'IBM Plex Sans', system-ui, sans-serif;
    --font-display: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --bg: light-dark(#e8eaee, #0f1114);
    --panel: light-dark(#f5f6f8, #15171b);
    --surface: light-dark(#ffffff, #1a1d22);
    --raised: light-dark(#ffffff, #22262c);
    --line: light-dark(#d8dce2, #282c33);
    --line-strong: light-dark(#c2c7cf, #363b43);
    --text: light-dark(#12151a, #e9ecf1);
    --text-2: light-dark(#4b535f, #a6adb9);
    --text-3: light-dark(#7c8490, #6d7481);
    --hover: light-dark(rgb(18 21 26 / 0.055), rgb(233 236 241 / 0.06));
    --active-bg: light-dark(#ffffff, #23272e);
    --accent: light-dark(oklch(0.48 0.18 var(--nb-h)), oklch(0.75 0.14 var(--nb-h)));
    --accent-ink: light-dark(#ffffff, #0f1114);
    --mark: light-dark(#ffd84d, #e8c440);
    --mark-soft: light-dark(#fff0a3, rgb(250 214 70 / 0.26));
    --focus: var(--accent);
    --radius: 6px;
    --radius-sm: 4px;
    --radius-lg: 10px;
    --shadow-card: 0 1px 1px light-dark(rgb(20 24 30 / 0.06), rgb(0 0 0 / 0.3));
    --shadow-pop: 0 2px 4px rgb(0 0 0 / 0.08), 0 18px 44px -12px light-dark(rgb(20 24 30 / 0.3), rgb(0 0 0 / 0.7));
    --ok: light-dark(#1d7a3d, #62d48b);
    --warn: light-dark(#9a5b00, #f1b44c);
    --danger: light-dark(#c0262d, #ff7b7b);
    --code-bg: light-dark(#ffffff, #17191d);
    --gutter-bg: light-dark(#f0f1f4, #1d2025);
    --cur-line: light-dark(#fff9d9, #2a2716);
    --col-bg: light-dark(#eceef2, #16181c);
    --card-bg: light-dark(#ffffff, #1f2227);
    --sel-bg: light-dark(oklch(0.95 0.03 var(--nb-h)), oklch(0.3 0.05 var(--nb-h)));
    --editor-tint: light-dark(oklch(0.993 0.006 var(--h)), oklch(0.205 0.012 var(--h)));
    --syn-h: light-dark(#0b4fd6, #7aa7ff);
    --syn-punct: light-dark(#98a0aa, #5d6470);
    --syn-link: light-dark(#8a17b8, #d58cff);
    --syn-code: light-dark(#a3161d, #ff8f8f);
    --syn-task: light-dark(#0a7d3c, #6ee39a);
    --syn-meta: light-dark(#8b6a00, #e6c35c);
    --syn-quote: light-dark(#5e6b78, #9aa7b4);
    --syn-tag: light-dark(#0e7c86, #62d6df);
    --syn-kw: light-dark(#0b4fd6, #7aa7ff);
    --syn-str: light-dark(#8b5a00, #f2c46a);
    --tb-bg: light-dark(oklch(0.43 0.16 var(--nb-h)), oklch(0.27 0.07 var(--nb-h)));
    --tb-text: #ffffff;
    --tb-muted: rgb(255 255 255 / 0.74);
    --tb-field: rgb(255 255 255 / 0.12);
    --tb-line: rgb(255 255 255 / 0.18);
    --tb-hover: rgb(255 255 255 / 0.12);
    --logo-b: #ffffff;
    --logo-t1: oklch(0.72 0.16 25);
    --logo-t2: oklch(0.84 0.15 85);
    --logo-m: var(--tb-bg);
    font-size: 13.5px;
  }

  /* ================= Shared components ================= */
  .device :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .device button {
    color: inherit;
  }
  .sp {
    flex: 1;
  }
  .muted {
    color: var(--text-3);
  }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    flex: none;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-2);
  }
  .icon-btn:hover,
  .icon-btn.on {
    background: var(--hover);
    color: var(--text);
  }
  .icon-btn.xs {
    width: 24px;
    height: 24px;
  }
  .icon-btn.xs .i {
    width: 14px;
    height: 14px;
  }
  .i.sm {
    width: 13px;
    height: 13px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 550;
    white-space: nowrap;
  }
  .btn:hover {
    background: color-mix(in oklab, var(--surface), var(--text) 5%);
  }
  .btn.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: transparent;
  }
  .btn.primary:hover {
    background: color-mix(in oklab, var(--accent), var(--surface) 12%);
  }
  .btn.sm {
    height: 28px;
    padding: 0 10px;
    font-size: 12.5px;
  }
  .btn.ghost {
    background: transparent;
    border-color: transparent;
    color: var(--text-2);
  }
  .btn.ghost:hover {
    background: var(--hover);
    color: var(--text);
  }
  .linkish {
    border: 0;
    background: none;
    padding: 0;
    color: var(--text-2);
    font-size: 12px;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  kbd {
    font-family: var(--font-mono, ui-monospace, monospace);
    font-size: 11px;
    line-height: 16px;
    padding: 0 5px;
    border-radius: 4px;
    border: 1px solid var(--line-strong);
    color: var(--text-2);
    background: var(--surface);
    white-space: nowrap;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 22px;
    padding: 0 8px;
    border-radius: 999px;
    background: var(--hover);
    color: var(--text-2);
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .chip .i {
    width: 13px;
    height: 13px;
  }
  .tag {
    color: var(--syn-tag);
    font-weight: 500;
  }
  .sec-dot {
    display: inline-block;
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--sec);
  }
  .avatar {
    display: inline-grid;
    place-items: center;
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: light-dark(oklch(0.62 0.12 var(--h)), oklch(0.5 0.1 var(--h)));
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .avatar.xs {
    width: 20px;
    height: 20px;
    font-size: 8.5px;
  }
  .avs {
    display: inline-flex;
    align-items: center;
  }
  .avs .avatar + .avatar {
    margin-left: -6px;
  }
  .avs .avatar {
    box-shadow: 0 0 0 2px var(--card-bg, var(--surface));
  }
  mark {
    background: var(--mark-soft);
    color: inherit;
    border-radius: 3px;
    padding: 0 1px;
  }
  .mini-seg {
    display: inline-flex;
    gap: 2px;
    padding: 2px;
    border-radius: var(--radius-sm);
    background: var(--hover);
    flex: none;
  }
  .mini-seg button {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 26px;
    padding: 0 9px;
    border: 0;
    border-radius: calc(var(--radius-sm) - 2px);
    background: transparent;
    color: var(--text-2);
    font-size: 12.5px;
    font-weight: 500;
  }
  .mini-seg button[aria-pressed='true'] {
    background: var(--surface);
    color: var(--text);
    box-shadow:
      0 1px 2px rgb(0 0 0 / 0.08),
      0 0 0 1px var(--line);
  }
  .mini-seg .i {
    width: 14px;
    height: 14px;
  }

  /* ----- Top bar ----- */
  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 52px;
    padding: 0 12px;
    background: var(--tb-bg);
    color: var(--tb-text);
    border-bottom: 1px solid var(--tb-line);
    position: relative;
    z-index: 3;
  }
  .tb-left,
  .tb-right {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tb-right {
    justify-content: flex-end;
    gap: 6px;
  }
  .topbar .icon-btn {
    color: var(--tb-muted);
  }
  .topbar .icon-btn:hover {
    background: var(--tb-hover);
    color: var(--tb-text);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    flex: none;
    font-family: var(--font-display);
    font-weight: 650;
    font-size: 16px;
    letter-spacing: -0.01em;
  }
  .logo {
    width: 26px;
    height: 26px;
    flex: none;
  }
  .lg-b {
    fill: var(--logo-b);
  }
  .lg-t1 {
    fill: var(--logo-t1);
  }
  .lg-t2 {
    fill: var(--logo-t2);
  }
  .lg-m {
    fill: none;
    stroke: var(--logo-m);
    stroke-width: 2.3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .crumbs {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    color: var(--tb-muted);
    font-size: 13px;
    padding-left: 10px;
    margin-left: 4px;
    border-left: 1px solid var(--tb-line);
  }
  .crumbs b {
    color: var(--tb-text);
    font-weight: 550;
  }
  .search-trigger {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 1 440px;
    min-width: 200px;
    height: 34px;
    padding: 0 8px 0 11px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--tb-line);
    background: var(--tb-field);
    color: var(--tb-muted);
    font-size: 13px;
  }
  .search-trigger span {
    flex: 1;
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .topbar kbd {
    background: transparent;
    border-color: var(--tb-line);
    color: var(--tb-muted);
  }
  .phone-title {
    flex-direction: column;
    min-width: 0;
    line-height: 1.2;
  }
  .phone-title small {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--tb-muted);
  }
  .phone-title b {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Save indicator */
  .save {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 30px;
    padding: 0 11px 0 9px;
    border-radius: 999px;
    border: 1px solid var(--tb-line);
    background: transparent;
    color: var(--tb-muted);
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
    flex: none;
  }
  .save .i {
    width: 15px;
    height: 15px;
  }
  .save[data-k='saved'] .i {
    color: var(--ok);
  }
  .save[data-k='saving'] .i {
    animation: spin 0.9s linear infinite;
  }
  .save[data-k='dirty'] .i {
    color: var(--warn);
  }
  .save[data-k='offline'] {
    color: var(--warn);
    border-color: color-mix(in oklab, var(--warn) 45%, transparent);
    background: color-mix(in oklab, var(--warn) 9%, transparent);
  }
  .save[data-k='conflict'] {
    color: var(--danger);
    border-color: color-mix(in oklab, var(--danger) 50%, transparent);
    background: color-mix(in oklab, var(--danger) 10%, transparent);
  }
  @keyframes spin {
    to {
      rotate: 360deg;
    }
  }

  /* ----- Rail (tablet) ----- */
  .rail {
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
  }
  .rail-nb {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    border: 0;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 14px;
    background: var(--sec-soft);
    color: var(--sec-ink);
  }
  .rail-nb.on {
    background: var(--sec);
    color: light-dark(#fff, #111);
  }
  .rail-sep {
    width: 24px;
    height: 1px;
    background: var(--line);
    margin: 6px 0;
  }
  .rail .grow {
    flex: 1;
  }

  /* ----- Sidebar ----- */
  .sidebar {
    flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow: hidden;
  }
  .sb-scroll {
    flex: 1;
    overflow: auto;
    padding: 10px 8px 12px;
    scrollbar-width: thin;
  }
  .sb-h {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 8px 4px 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 30px;
    padding: 0 8px;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-2);
    font-size: 13.5px;
    text-align: left;
    white-space: nowrap;
  }
  .row:hover {
    background: var(--hover);
    color: var(--text);
  }
  .row.active {
    background: var(--active-bg);
    color: var(--text);
    font-weight: 550;
  }
  .row .rl {
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .count,
  .row kbd {
    margin-left: auto;
  }
  .row .count {
    font-size: 11.5px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }
  .row .chev {
    width: 14px;
    height: 14px;
    color: var(--text-3);
  }
  .row.indent-1 {
    padding-left: 30px;
  }
  .row.indent-2 {
    padding-left: 50px;
  }
  .grp-row {
    color: var(--text-3);
    font-size: 12.5px;
    cursor: default;
  }
  .grp-row:hover {
    background: transparent;
    color: var(--text-3);
  }
  .nb-icon {
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    border-radius: 6px;
    background: var(--sec);
    color: light-dark(#fff, #111);
    flex: none;
  }
  .nb-icon .i {
    width: 12px;
    height: 12px;
    stroke-width: 2.2;
  }
  .sec-sq {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: var(--sec);
    flex: none;
  }
  .sb-foot {
    flex: none;
    border-top: 1px solid var(--line);
    padding: 6px 8px;
  }

  /* ----- Panes ----- */
  .pane {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    overflow: hidden;
    position: relative;
  }
  .sectabs {
    flex: none;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 44px;
    padding: 0 12px;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .sectabs::-webkit-scrollbar {
    display: none;
  }
  .tabgroup {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    flex: none;
    height: 34px;
    padding: 0 8px 0 2px;
    margin-right: 4px;
    color: var(--text-3);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .tabgroup .i {
    width: 14px;
    height: 14px;
  }
  .tab-div {
    flex: none;
    width: 1px;
    height: 18px;
    background: var(--line-strong);
    margin: 0 6px 8px;
  }
  .sectab {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex: none;
    height: 34px;
    padding: 0 12px;
    border: 0;
    background: transparent;
    color: var(--text-2);
    font-size: 13.5px;
    font-weight: 500;
    white-space: nowrap;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  }
  .sectab:hover {
    color: var(--text);
  }
  .sectab.active {
    color: var(--text);
    font-weight: 600;
  }
  .sectab.add {
    color: var(--text-3);
    padding: 0 8px;
  }

  .page-head {
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 22px 28px 14px;
  }
  .ph-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .page-title {
    margin: 0;
    min-width: 0;
    font-family: var(--font-display);
    font-size: 30px;
    line-height: 1.15;
    font-weight: 650;
    letter-spacing: -0.022em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ph-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: none;
  }
  .ph-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    font-size: 12.5px;
    color: var(--text-3);
  }
  .ph-meta .bl {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .ph-meta .bl .i {
    width: 13px;
    height: 13px;
  }

  /* ----- Markdown split editor ----- */
  .md-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--line);
  }
  .md-split {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }
  .md-split[data-view='source'],
  .md-split[data-view='preview'] {
    grid-template-columns: minmax(0, 1fr);
  }
  .md-split[data-view='source'] .md-preview,
  .md-split[data-view='preview'] .md-source {
    display: none;
  }
  .md-source {
    overflow: auto;
    background: var(--code-bg);
    border-right: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 21px;
    padding: 8px 0 48px;
    cursor: text;
    scrollbar-width: thin;
  }
  .md-lines {
    min-width: 100%;
    width: max-content;
  }
  .md-source.wrap .md-lines {
    width: auto;
  }
  .md-line {
    display: grid;
    grid-template-columns: 40px 16px minmax(0, 1fr);
    min-height: 21px;
    padding-right: 18px;
  }
  .md-line .gut {
    text-align: right;
    padding-right: 6px;
    color: var(--text-3);
    font-size: 11.5px;
    user-select: none;
    background: var(--gutter-bg);
  }
  .md-line .fold {
    display: grid;
    place-items: center;
    color: var(--text-3);
    background: var(--gutter-bg);
  }
  .md-line .fold .i {
    width: 12px;
    height: 12px;
  }
  .md-line .code {
    white-space: pre;
    padding-left: 8px;
  }
  .md-source.wrap .md-line:not(.k-table) .code {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .md-line.cur {
    background: var(--cur-line);
  }
  .md-line.cur .gut {
    color: var(--text);
    font-weight: 600;
  }
  .md-line.flash .code {
    animation: flash 1.1s ease;
  }
  @keyframes flash {
    0%,
    30% {
      background: var(--mark-soft);
    }
    100% {
      background: transparent;
    }
  }
  .t-p,
  .t-pipe,
  .t-sep,
  .t-hm {
    color: var(--syn-punct);
  }
  .t-h {
    color: var(--syn-h);
    font-weight: 700;
  }
  .t-b {
    font-weight: 700;
    color: var(--text);
  }
  .t-i {
    font-style: italic;
  }
  .t-l {
    color: var(--syn-link);
    text-decoration: underline;
    text-decoration-color: color-mix(in oklab, currentColor 35%, transparent);
    text-underline-offset: 3px;
  }
  .t-u {
    color: var(--text-3);
  }
  .t-c {
    color: var(--syn-code);
  }
  .t-task {
    color: var(--syn-task);
    font-weight: 600;
  }
  .t-done {
    color: var(--text-3);
  }
  .t-key {
    color: var(--syn-meta);
    font-weight: 500;
  }
  .t-meta {
    color: var(--syn-meta);
  }
  .t-q {
    color: var(--syn-quote);
    font-style: italic;
  }
  .t-callout {
    color: var(--syn-kw);
    font-weight: 600;
  }
  .t-tag {
    color: var(--syn-tag);
  }
  .t-th {
    font-weight: 700;
    color: var(--text);
  }
  .t-kw {
    color: var(--syn-kw);
    font-weight: 500;
  }
  .t-str {
    color: var(--syn-str);
  }
  .t-num {
    color: var(--syn-code);
  }
  .t-lang {
    color: var(--syn-meta);
  }
  .md-preview {
    overflow: auto;
    padding: 20px 34px 56px;
    scrollbar-width: thin;
  }
  .statusbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 28px;
    padding: 0 12px;
    border-top: 1px solid var(--line);
    background: var(--code-bg);
    color: var(--text-3);
    font-size: 11.5px;
    white-space: nowrap;
    overflow: hidden;
  }
  .sb-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 22px;
    padding: 0 7px;
    margin: 0 -7px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: inherit;
    font-size: inherit;
  }
  .sb-btn:hover {
    background: var(--hover);
    color: var(--text);
  }
  .sb-btn .i {
    width: 13px;
    height: 13px;
  }
  .sb-btn.ok .i {
    color: var(--ok);
  }
  .sb-btn.warn {
    color: var(--warn);
    font-weight: 600;
  }
  .accessory {
    flex: none;
    display: flex;
    gap: 2px;
    padding: 6px 8px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .accessory button {
    flex: none;
    display: grid;
    place-items: center;
    width: 40px;
    height: 36px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--text-2);
  }
  .accessory button:active {
    background: var(--hover);
  }
  .accessory .i {
    width: 18px;
    height: 18px;
  }

  /* ----- Prose (preview + rich text) ----- */
  .prose {
    max-width: 760px;
    font-size: 15px;
    line-height: 1.65;
    color: var(--text);
  }
  .prose > :first-child {
    margin-top: 0;
  }
  .prose h1 {
    font-family: var(--font-display);
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .prose h2 {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 28px 0 10px;
  }
  .prose h3 {
    font-size: 16px;
    font-weight: 650;
    margin: 22px 0 8px;
  }
  .prose p {
    margin: 0 0 12px;
  }
  .prose ul,
  .prose ol {
    margin: 0 0 14px;
    padding-left: 22px;
  }
  .prose li {
    margin: 3px 0;
  }
  .prose table {
    width: 100%;
    border-collapse: collapse;
    margin: 6px 0 18px;
    font-size: 13.5px;
    font-variant-numeric: tabular-nums;
  }
  .prose th,
  .prose td {
    padding: 8px 9px;
    border-bottom: 1px solid var(--line);
    text-align: left;
  }
  .prose th,
  .prose .r {
    white-space: nowrap;
  }
  .prose th {
    color: var(--text-2);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .prose .r {
    text-align: right;
  }
  .prose code {
    font-family: var(--font-mono);
    font-size: 0.86em;
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--hover);
  }
  .prose pre {
    margin: 4px 0 16px;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--code-bg);
    overflow: auto;
    font-size: 12.5px;
    line-height: 1.6;
  }
  .prose pre code {
    padding: 0;
    background: none;
    font-size: inherit;
  }
  .prose blockquote {
    margin: 0 0 14px;
    padding: 2px 0 2px 14px;
    border-left: 3px solid var(--line-strong);
    color: var(--text-2);
    font-style: italic;
  }
  .prose.sm {
    font-size: 14px;
    line-height: 1.6;
  }
  .wikilink,
  .prose a {
    color: var(--syn-link);
    text-decoration: underline;
    text-decoration-color: color-mix(in oklab, currentColor 40%, transparent);
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .tasks {
    list-style: none;
    padding: 0 !important;
    margin: 0 0 14px;
  }
  .tasks li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 2px 0;
    padding: 2px 0;
  }
  .tasks li.done > span:last-child {
    color: var(--text-3);
    text-decoration: line-through;
    text-decoration-color: color-mix(in oklab, currentColor 50%, transparent);
  }
  .cb {
    display: grid;
    place-items: center;
    flex: none;
    width: 17px;
    height: 17px;
    margin-top: 0.22em;
    border-radius: 5px;
    border: 1.5px solid var(--line-strong);
    background: var(--surface);
  }
  .cb.on {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .cb .i {
    width: 12px;
    height: 12px;
    stroke-width: 3;
  }
  .callout {
    display: flex;
    gap: 12px;
    margin: 4px 0 16px;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    background: color-mix(in oklab, var(--syn-task) 9%, transparent);
    border: 1px solid color-mix(in oklab, var(--syn-task) 24%, transparent);
  }
  .callout > .i {
    color: var(--syn-task);
    margin-top: 3px;
  }
  .callout p {
    margin: 0;
  }
  .callout b {
    display: block;
    font-size: 13px;
  }
  .callout.note {
    background: color-mix(in oklab, var(--accent) 7%, transparent);
    border-color: color-mix(in oklab, var(--accent) 22%, transparent);
  }
  .callout.note > .i {
    color: var(--accent);
  }

  /* ----- Rich text ----- */
  .rt-toolbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    position: relative;
    z-index: 4;
  }
  .rt-tools {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .rt-tools::-webkit-scrollbar {
    display: none;
  }
  .tb-sep {
    flex: none;
    width: 1px;
    height: 20px;
    margin: 0 6px;
    background: var(--line);
  }
  .tb-select {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex: none;
    min-width: 124px;
    height: 30px;
    padding: 0 8px 0 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: transparent;
    font-size: 13px;
  }
  .rt-tools .icon-btn {
    width: 30px;
    height: 30px;
  }
  .rt-right {
    position: relative;
    flex: none;
  }
  .rt-scroll {
    flex: 1;
    min-height: 0;
    overflow: auto;
    scrollbar-width: thin;
  }
  .rt-page {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 12px 80px;
  }
  .rt-page .page-head {
    padding: 28px 28px 8px;
  }
  .rt-doc {
    padding: 8px 28px 0;
    max-width: none;
  }
  .rt-doc .lead {
    font-size: 16.5px;
    color: var(--text-2);
  }
  .rt-doc table th,
  .rt-doc table td {
    border: 1px solid var(--line-strong);
  }
  .rt-doc table th {
    background: var(--hover);
    color: var(--text);
    text-transform: none;
    letter-spacing: 0;
    font-size: 13px;
  }
  .rt-doc td.us {
    background: color-mix(in oklab, var(--accent) 7%, transparent);
    font-weight: 550;
  }
  .yes {
    color: var(--ok);
    font-weight: 700;
  }
  .no {
    color: var(--text-3);
  }
  .rt-figure {
    position: relative;
    margin: 58px 0 18px;
  }
  .shot-wrap {
    position: relative;
    outline: 2px solid var(--focus);
    outline-offset: 3px;
    border-radius: 8px;
  }
  .handle {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: var(--surface);
    border: 2px solid var(--focus);
  }
  .handle.tl {
    left: -9px;
    top: -9px;
  }
  .handle.tr {
    right: -9px;
    top: -9px;
  }
  .handle.bl {
    left: -9px;
    bottom: -9px;
  }
  .handle.br {
    right: -9px;
    bottom: -9px;
  }
  .img-tools {
    position: absolute;
    top: -50px;
    left: 50%;
    translate: -50% 0;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: var(--radius-sm);
    background: var(--raised);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-pop);
    white-space: nowrap;
    z-index: 2;
  }
  .img-tools .icon-btn {
    width: 28px;
    height: 28px;
  }
  .img-tools .sz {
    border: 0;
    background: transparent;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
    padding: 0 7px;
    height: 28px;
    border-radius: 5px;
  }
  .img-tools .sz.on {
    background: var(--hover);
    color: var(--text);
  }
  .rt-figure figcaption {
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--text-3);
    text-align: center;
  }
  /* The pasted "screenshot" stays light in both themes, like a real image. */
  .shot {
    aspect-ratio: 16 / 10;
    display: flex;
    flex-direction: column;
    border-radius: 8px;
    overflow: hidden;
    background: #ffffff;
    border: 1px solid #d9dce1;
  }
  .shot-bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 5px;
    height: 22px;
    padding: 0 9px;
    background: #eef0f3;
    border-bottom: 1px solid #e1e4e8;
  }
  .shot-bar i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #d5d8dd;
  }
  .shot-bar i:nth-child(1) {
    background: #f1a097;
  }
  .shot-bar i:nth-child(2) {
    background: #f3cf7a;
  }
  .shot-bar i:nth-child(3) {
    background: #98d49c;
  }
  .shot-bar span {
    margin-left: 12px;
    width: 34%;
    height: 10px;
    border-radius: 5px;
    background: #fff;
    border: 1px solid #e1e4e8;
  }
  .shot-body {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 24% 1fr;
  }
  .shot-side {
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 14px 12px;
    background: #f6f7f9;
    border-right: 1px solid #eceef1;
  }
  .shot-side .b {
    width: 58%;
    height: 12px;
    border-radius: 3px;
    background: #24272c;
    margin-bottom: 6px;
  }
  .shot-side .l {
    height: 8px;
    border-radius: 4px;
    background: #dfe2e6;
  }
  .shot-side .l.on {
    background: #9ad6cc;
  }
  .shot-main {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 22px 26px;
    min-height: 0;
  }
  .shot-h {
    width: 46%;
    height: 16px;
    border-radius: 4px;
    background: #1f2226;
  }
  .shot-p {
    width: 88%;
    height: 8px;
    border-radius: 4px;
    background: #e2e5e9;
  }
  .shot-p.w70 {
    width: 66%;
  }
  .shot-cards {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 8px;
    max-height: 44%;
  }
  .shot-cards div {
    border-radius: 6px;
    border: 1px solid #e6e8ec;
    background: linear-gradient(#e6f5f2 0 40%, #ffffff 40%);
  }
  .shot-btn {
    width: 26%;
    height: 22px;
    margin-top: auto;
    border-radius: 6px;
    background: #1a8f7e;
  }
  .menu {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    min-width: 248px;
    padding: 6px;
    border-radius: var(--radius);
    background: var(--raised);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-pop);
    z-index: 30;
    backdrop-filter: blur(20px);
  }
  .menu button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    height: 34px;
    padding: 0 10px;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text);
    font-size: 13px;
    text-align: left;
  }
  .menu button:hover {
    background: var(--hover);
  }
  .menu .sub {
    margin-left: auto;
    color: var(--text-3);
    font-size: 11.5px;
  }
  .menu hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 6px 4px;
  }
  .menu-label {
    padding: 6px 10px 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-3);
  }

  /* ----- Empty state ----- */
  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 40px 24px;
    text-align: center;
  }
  .empty-art {
    position: relative;
    width: 128px;
    height: 100px;
    margin-bottom: 10px;
  }
  .empty-art i {
    position: absolute;
    width: 70px;
    height: 88px;
    border-radius: 10px;
    border: 1.5px solid var(--sec);
    background: var(--sec-softer);
  }
  .empty-art i:nth-child(1) {
    left: 6px;
    top: 8px;
    rotate: -9deg;
    opacity: 0.55;
  }
  .empty-art i:nth-child(2) {
    left: 50px;
    top: 6px;
    rotate: 8deg;
    opacity: 0.75;
  }
  .empty-art i:nth-child(3) {
    left: 29px;
    top: 0;
    display: grid;
    place-items: center;
    background: var(--surface);
    color: var(--sec);
  }
  .empty-art .i {
    width: 26px;
    height: 26px;
  }
  .empty h2 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 20px;
    letter-spacing: -0.01em;
  }
  .empty p {
    margin: 0;
    max-width: 400px;
    color: var(--text-2);
  }
  .empty .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 8px;
  }
  .empty .hint {
    font-size: 12.5px;
    color: var(--text-3);
    margin-top: 6px;
  }

  /* ----- Second pane (ultra-wide) ----- */
  .pane2-head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 10px 0 16px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    color: var(--text-2);
    white-space: nowrap;
  }
  .pane2-head b {
    color: var(--text);
    font-weight: 600;
  }
  .p2-scroll {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 28px 44px 60px;
  }
  .p2-meta {
    color: var(--text-3);
    font-size: 13px;
  }

  /* ----- Page list ----- */
  .pagelist {
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow: hidden;
  }
  .pl-head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 14px 12px 10px 16px;
  }
  .pl-head h3 {
    margin: 0;
    font-size: 14.5px;
    font-weight: 650;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pl-head .sub {
    font-size: 12px;
    color: var(--text-3);
  }
  .pl-filter,
  .kb-filter {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-3);
  }
  .pl-filter {
    flex: none;
    margin: 0 12px 8px;
  }
  .pl-filter input,
  .kb-filter input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 13px;
    color: var(--text);
  }
  .pl-list {
    flex: 1;
    overflow: auto;
    padding: 0 8px 14px;
    scrollbar-width: thin;
  }
  .pg {
    position: relative;
    display: block;
    width: 100%;
    margin-bottom: 2px;
    padding: 9px 10px;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    text-align: left;
  }
  .pg:hover {
    background: var(--hover);
  }
  .pg .t {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13.5px;
    font-weight: 550;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
  }
  .pg .t .tt {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pg .t .i {
    width: 14px;
    height: 14px;
    color: var(--text-3);
  }
  .pg .s {
    display: block;
    margin-top: 2px;
    font-size: 12.5px;
    color: var(--text-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pg .m {
    display: block;
    margin-top: 3px;
    font-size: 11.5px;
    color: var(--text-3);
  }
  .pg.sub {
    margin-left: 18px;
    width: calc(100% - 18px);
  }
  .pg.sub::before {
    content: '';
    position: absolute;
    left: -10px;
    top: -2px;
    bottom: 50%;
    width: 8px;
    border-left: 1px solid var(--line-strong);
    border-bottom: 1px solid var(--line-strong);
    border-bottom-left-radius: 6px;
  }
  .pg.active {
    background: var(--active-bg);
  }
  .pl-empty {
    padding: 30px 16px;
    text-align: center;
    color: var(--text-3);
    font-size: 13px;
  }

  /* ----- Inspector (wide) ----- */
  .inspector {
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow: auto;
    padding: 16px 16px 28px;
    scrollbar-width: thin;
  }
  .insp-sec {
    padding-bottom: 14px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .insp-sec:last-child {
    border-bottom: 0;
  }
  .insp-h {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .outline a {
    display: block;
    padding: 4px 8px;
    border-radius: 6px;
    color: var(--text-2);
    font-size: 13px;
    cursor: pointer;
  }
  .outline a:hover {
    background: var(--hover);
  }
  .outline a.on {
    color: var(--text);
    font-weight: 550;
    background: var(--hover);
  }
  .outline a.l3 {
    padding-left: 22px;
  }
  .blink {
    display: flex;
    gap: 9px;
    padding: 7px 8px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: var(--text);
  }
  .blink:hover {
    background: var(--hover);
  }
  .blink .i {
    margin-top: 2px;
    color: var(--text-3);
  }
  .blink small {
    display: block;
    color: var(--text-3);
    font-size: 12px;
    line-height: 1.4;
  }
  .blink small b {
    color: var(--text-2);
    font-weight: 600;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .revs {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .revs li {
    position: relative;
    padding: 0 0 12px 18px;
    font-size: 12.5px;
    color: var(--text-3);
  }
  .revs li::before {
    content: '';
    position: absolute;
    left: 3px;
    top: 5px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1.5px solid var(--line-strong);
    background: var(--panel);
  }
  .revs li::after {
    content: '';
    position: absolute;
    left: 6.5px;
    top: 15px;
    bottom: 0;
    width: 1px;
    background: var(--line);
  }
  .revs li:last-child::after {
    display: none;
  }
  .revs li.on::before {
    background: var(--ok);
    border-color: var(--ok);
  }
  .revs b {
    display: block;
    color: var(--text);
    font-weight: 550;
    font-size: 13px;
  }
  .info {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 5px 14px;
    margin: 0;
    font-size: 12.5px;
  }
  .info dt {
    color: var(--text-3);
  }
  .info dd {
    margin: 0;
    color: var(--text);
  }

  /* ----- Kanban ----- */
  .kb-head {
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px 20px 12px;
  }
  .kb-title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .kb-crumb {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--text-3);
    flex: none;
  }
  .kb-title {
    margin: 0;
    min-width: 0;
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 650;
    letter-spacing: -0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .kb-tabs {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid var(--line);
  }
  .kb-tab {
    flex: none;
    height: 32px;
    padding: 0 12px;
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 500;
    margin-bottom: -1px;
  }
  .kb-tab.on {
    color: var(--text);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }
  .kb-tools {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .kb-filter {
    width: 220px;
    flex: 0 1 220px;
    min-width: 0;
  }
  .chip-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px dashed var(--line-strong);
    background: transparent;
    color: var(--text-2);
    font-size: 12.5px;
    white-space: nowrap;
  }
  .chip-btn .i {
    width: 14px;
    height: 14px;
  }
  .chip-btn .i:last-child {
    width: 12px;
    height: 12px;
    color: var(--text-3);
  }
  .kb-coltabs {
    display: none;
  }
  .kb-cols {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 4px 20px 20px;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .col {
    display: flex;
    flex-direction: column;
    flex: 1 0 280px;
    max-width: 400px;
    max-height: 100%;
    border-radius: var(--radius);
    background: var(--col-bg);
    transition: box-shadow 0.15s;
  }
  .col.drop {
    box-shadow: inset 0 0 0 2px var(--focus);
  }
  .col-head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 8px 8px 12px;
    font-size: 13px;
    font-weight: 600;
  }
  .col-head .n {
    color: var(--text-3);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .wip {
    font-size: 11px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--hover);
    color: var(--text-2);
  }
  .wip.over {
    background: color-mix(in oklab, var(--danger) 14%, transparent);
    color: var(--danger);
  }
  .col-body {
    flex: 1 1 auto;
    min-height: 24px;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 0 8px 4px;
    scrollbar-width: thin;
  }
  .add-card {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 4px 8px 8px;
    height: 32px;
    padding: 0 8px;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-3);
    font-size: 13px;
  }
  .add-card:hover {
    background: var(--hover);
    color: var(--text);
  }
  .card {
    padding: 10px 11px;
    border-radius: calc(var(--radius-sm) + 2px);
    border: 1px solid var(--line);
    background: var(--card-bg);
    box-shadow: var(--shadow-card);
    cursor: grab;
    user-select: none;
  }
  .card:hover {
    border-color: var(--line-strong);
  }
  .card.sel {
    border-color: var(--focus);
    box-shadow:
      0 0 0 1px var(--focus),
      var(--shadow-card);
  }
  .card.dragging {
    opacity: 0.4;
  }
  .card.hidden {
    display: none;
  }
  .labels {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 6px;
  }
  .lbl {
    display: inline-flex;
    align-items: center;
    height: 18px;
    padding: 0 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    background: var(--sec-soft);
    color: var(--sec-ink);
  }
  .card .ttl {
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.35;
    color: var(--text);
  }
  .card .meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 9px;
    font-size: 11.5px;
    color: var(--text-3);
    min-height: 20px;
  }
  .card .meta .b {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }
  .card .meta .i {
    width: 13px;
    height: 13px;
  }
  .card .cid {

    font-size: 11px;
  }
  .card .avs {
    margin-left: auto;
  }
  .due.soon {
    color: var(--warn);
    font-weight: 600;
  }
  .due.over {
    color: var(--danger);
    font-weight: 600;
  }
  .b.ok {
    color: var(--ok);
  }
  .col.done .card .ttl {
    color: var(--text-2);

  .kb-detail {
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--line);
    overflow: hidden;
  }
  .kd-head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 52px;
    padding: 0 10px 0 16px;
    border-bottom: 1px solid var(--line);
  }
  .kd-id {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-3);
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 8px 0 10px;
    border-radius: 999px;
    border: 0;
    background: var(--sec-soft);
    color: var(--sec-ink);
    font-size: 12.5px;
    font-weight: 600;
  }
  .kd-scroll {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 18px 20px 32px;
    scrollbar-width: thin;
  }
  .kd-title {
    margin: 0 0 16px;
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 650;
    line-height: 1.25;
    letter-spacing: -0.015em;
  }
  .props {
    display: grid;
    grid-template-columns: 112px 1fr;
    align-items: center;
    gap: 8px 12px;
    margin: 0 0 6px;
    font-size: 13px;
  }
  .props dt {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--text-3);
  }
  .props dt .i {
    width: 14px;
    height: 14px;
  }
  .props dd {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin: 0;
    min-height: 26px;
  }
  .prio {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-weight: 600;
    color: var(--danger);
  }
  .kd-sec {
    margin-top: 22px;
  }
  .kd-sec h4 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 10px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .kd-sec h4 .sp + * {
    text-transform: none;
    letter-spacing: 0;
  }
  .progress {
    height: 6px;
    border-radius: 3px;
    background: var(--hover);
    overflow: hidden;
    margin-bottom: 10px;
  }
  .progress i {
    display: block;
    height: 100%;
    border-radius: 3px;
    background: var(--ok);
    transition: width 0.3s;
  }
  .kd-sec .tasks li {
    cursor: pointer;
    font-size: 13.5px;
    padding: 4px 6px;
    margin: 0 -6px;
    border-radius: 6px;
  }
  .kd-sec .tasks li:hover {
    background: var(--hover);
  }
  .note-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 8px 9px 12px;
    margin-bottom: 6px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--panel);
  }
  .note-link .nl-ic {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: var(--sec-soft);
    color: var(--sec-ink);
    flex: none;
  }
  .note-link .nl-main {
    flex: 1;
    min-width: 0;
  }
  .note-link .nt {
    display: block;
    font-size: 13.5px;
    font-weight: 550;
    color: var(--text);
  }
  .note-link .ns {
    display: block;
    font-size: 12px;
    color: var(--text-3);
  }
  .picker {
    margin-top: 8px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--raised);
    box-shadow: var(--shadow-pop);
    overflow: hidden;
    backdrop-filter: blur(20px);
  }
  .picker-in {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 12px;
    border-bottom: 1px solid var(--line);
    color: var(--text-3);
  }
  .picker-in input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 14px;
    color: var(--text);
  }
  .picker-list {
    max-height: 300px;
    overflow: auto;
    padding: 4px;
  }
  .picker-group {
    padding: 8px 10px 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .picker-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    text-align: left;
  }
  .picker-item.sel,
  .picker-item:hover {
    background: var(--sel-bg);
  }
  .pi-t {
    flex: 1;
    min-width: 0;
    font-size: 13.5px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pi-s {
    font-size: 12px;
    color: var(--text-3);
    white-space: nowrap;
  }
  .picker-foot {
    display: flex;
    gap: 14px;
    padding: 8px 12px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    color: var(--text-3);
  }
  .picker-empty {
    padding: 16px 12px;
    font-size: 13px;
    color: var(--text-2);
  }
  .activity {
    list-style: none;
    margin: 0 0 12px;
    padding: 0;
    font-size: 13px;
    color: var(--text-2);
  }
  .activity li {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 5px 0;
  }
  .activity b {
    color: var(--text);
    font-weight: 550;
  }
  .activity small {
    color: var(--text-3);
  }
  .comment-box {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .comment-box span.fake-in {
    flex: 1;
    display: flex;
    align-items: center;
    height: 36px;
    padding: 0 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text-3);
    font-size: 13px;
  }

  /* ----- Command palette ----- */
  .pal-scrim {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 72px 16px 16px;
    background: light-dark(rgb(18 20 26 / 0.28), rgb(0 0 0 / 0.55));
    backdrop-filter: blur(3px);
    animation: fade 0.16s ease;
  }
  .palette {
    display: flex;
    flex-direction: column;
    width: min(880px, 100%);
    max-height: min(640px, 100%);
    border-radius: var(--radius-lg);
    border: 1px solid var(--line);
    background: var(--raised);
    box-shadow: var(--shadow-pop);
    overflow: hidden;
    backdrop-filter: blur(28px) saturate(1.4);
    animation: pop 0.18s ease;
  }
  .pal-input {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 56px;
    padding: 0 14px 0 16px;
    border-bottom: 1px solid var(--line);
    color: var(--text-3);
  }
  .pal-input .i {
    width: 18px;
    height: 18px;
  }
  .pal-input input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 17px;
    color: var(--text);
  }
  .kbd-btn {
    border: 0;
    background: none;
    padding: 0;
  }
  .pal-scopes {
    flex: none;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .scope {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: none;
    height: 28px;
    padding: 0 10px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--text-2);
    font-size: 12.5px;
    font-weight: 500;
  }
  .scope span {
    font-size: 11px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }
  .scope.on {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .scope.on span {
    color: inherit;
    opacity: 0.75;
  }
  .pal-hint {
    font-size: 12px;
    color: var(--text-3);
    white-space: nowrap;
  }
  .pal-body {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
  }
  .pal-list {
    overflow: auto;
    padding: 6px;
    scrollbar-width: thin;
  }
  .pal-group {
    padding: 10px 10px 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .pal-item {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .pal-item.sel {
    background: var(--sel-bg);
  }
  .pal-ic {
    display: grid;
    place-items: center;
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--hover);
    color: var(--text-2);
  }
  .pal-ic.hue {
    background: var(--sec-soft);
    color: var(--sec-ink);
  }
  .pal-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .pal-item .pt {
    font-size: 14px;
    font-weight: 550;
    color: var(--text);
  }
  .pal-item .pp {
    font-size: 12px;
    color: var(--text-3);
  }
  .pal-item .ps {
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--text-2);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .pal-when,
  .pal-id {
    flex: none;
    font-size: 11.5px;
    color: var(--text-3);
    white-space: nowrap;
  }
  .pal-id {
    font-family: var(--font-mono);
  }
  .pal-preview {
    display: none;
    overflow: auto;
    padding: 20px 22px;
    border-left: 1px solid var(--line);
    background: var(--panel);
  }
  .pv-path {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--text-3);
  }
  .pv-title {
    margin: 6px 0 2px;
    font-family: var(--font-display);
    font-size: 20px;
    letter-spacing: -0.015em;
  }
  .pv-meta {
    font-size: 12px;
    color: var(--text-3);
    margin-bottom: 14px;
  }
  .pv-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .pal-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 40px 16px;
    color: var(--text-3);
    text-align: center;
  }
  .pal-empty b {
    color: var(--text);
  }
  .pal-foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 9px 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--text-3);
    white-space: nowrap;
  }
  .pal-foot kbd + kbd {
    margin-left: 2px;
  }

  /* ----- Bottom nav, scrim, toast ----- */
  .bnav {
    display: none;
  }
  .toast-host {
    position: absolute;
    left: 50%;
    bottom: calc(20px + var(--safe-b));
    translate: -50% 0;
    z-index: 60;
    width: max-content;
    max-width: calc(100% - 32px);
    pointer-events: none;
  }
  .toast {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 14px;
    border-radius: var(--radius);
    background: var(--text);
    color: var(--bg);
    font-size: 13px;
    box-shadow: var(--shadow-pop);
    animation: pop 0.2s ease;
  }
  @keyframes fade {
    from {
      opacity: 0;
    }
  }
  @keyframes pop {
    from {
      opacity: 0;
      transform: translateY(6px) scale(0.985);
    }
  }
  @keyframes slide-l {
    from {
      transform: translateX(-24px);
      opacity: 0;
    }
  }
  @keyframes slide-r {
    from {
      transform: translateX(24px);
      opacity: 0;
    }
  }
  @keyframes slide-up {
    from {
      transform: translateY(40px);
      opacity: 0;
    }
  }

  /* ================= Layout (container queries on the device) ================= */
  .body {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    position: relative;
  }
  .body > * {
    min-width: 0;
    min-height: 0;
  }
  .rail,
  .sidebar,
  .pagelist,
  .inspector,
  .pane2,
  .kb-detail,
  .scrim {
    display: none;
  }
  .show-phone,
  .show-tablet-down {
    display: none !important;
  }
  @container app (width < 1024px) {
    .show-tablet-down {
      display: flex !important;
    }
    .hide-tablet {
      display: none !important;
    }
    .scrim {
      display: block;
      position: absolute;
      inset: 0;
      z-index: 30;
      background: light-dark(rgb(15 17 20 / 0.3), rgb(0 0 0 / 0.55));
      animation: fade 0.2s ease;
    }
    .body.drawer .sidebar {
      display: flex;
      position: absolute;
      z-index: 31;
      left: 0;
      top: 0;
      bottom: 0;
      width: min(304px, 86%);
      box-shadow: var(--shadow-pop);
      animation: slide-l 0.22s ease;
    }
    .body.pages .pagelist {
      display: flex;
      position: absolute;
      z-index: 31;
      right: 0;
      top: 0;
      bottom: 0;
      width: min(320px, 88%);
      box-shadow: var(--shadow-pop);
      animation: slide-r 0.22s ease;
    }
    .body.card-open .kb-detail {
      display: flex;
      position: absolute;
      z-index: 31;
      right: 0;
      top: 0;
      bottom: 0;
      width: min(440px, 92%);
      box-shadow: var(--shadow-pop);
      animation: slide-r 0.22s ease;
    }
  }
  @container app (width < 640px) {
    .show-phone {
      display: flex !important;
    }
    .hide-phone {
      display: none !important;
    }
    .topbar {
      padding: 0 6px 0 4px;
      gap: 4px;
    }
    .save {
      padding: 0 8px;
      height: 32px;
    }
    .save .save-l {
      display: none;
    }
    .save[data-k='offline'] .save-l,
    .save[data-k='conflict'] .save-l {
      display: inline;
    }
    .body.pages .pagelist {
      left: 0;
      right: 0;
      top: auto;
      width: auto;
      height: 72%;
      border-radius: 18px 18px 0 0;
      border: 0;
      animation: slide-up 0.25s ease;
    }
    .body.card-open .kb-detail {
      left: 0;
      width: auto;
      border: 0;
      border-radius: 0;
    }
    .bnav {
      display: flex;
      flex: none;
      height: calc(58px + var(--safe-b));
      padding-bottom: var(--safe-b);
      border-top: 1px solid var(--line);
      background: var(--panel);
      position: relative;
      z-index: 3;
    }
    .bnav button {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: 0;
      background: transparent;
      color: var(--text-3);
      font-size: 11px;
      font-weight: 500;
    }
    .bnav button.on {
      color: var(--text);
    }
    .bnav .i {
      width: 21px;
      height: 21px;
    }
    .toast-host {
      bottom: calc(70px + var(--safe-b));
    }
    .page-head {
      padding: 14px 16px 10px;
      gap: 6px;
    }
    .page-title {
      font-size: 23px;
    }
    .sectabs {
      height: 42px;
      padding: 0 8px;
    }
    .tabgroup,
    .tab-div {
      display: none;
    }
    .md-source {
      font-size: 12.5px;
      line-height: 20px;
    }
    .md-line {
      grid-template-columns: 30px 12px minmax(0, 1fr);
      min-height: 20px;
      padding-right: 12px;
    }
    .md-line .fold .i {
      width: 10px;
      height: 10px;
    }
    .md-line .code {
      padding-left: 5px;
    }
    .md-preview {
      padding: 16px 18px 40px;
    }
    .statusbar {
      display: none;
    }
    .rt-page {
      padding: 0 0 60px;
    }
    .rt-page .page-head {
      padding: 18px 16px 6px;
    }
    .rt-doc {
      padding: 6px 16px 0;
    }
    .img-tools {
      display: none;
    }
    .rt-figure {
      margin-top: 20px;
    }
    .kb-head {
      padding: 12px 14px 8px;
      gap: 8px;
    }
    .kb-title {
      font-size: 20px;
    }
    .kb-filter {
      flex: 1 1 auto;
      width: auto;
    }
    .kb-coltabs {
      display: flex;
      gap: 4px;
      padding: 0 14px 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: none;
    }
    .kb-coltabs button {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text-2);
      font-size: 12.5px;
      font-weight: 500;
    }
    .kb-coltabs button.on {
      background: var(--text);
      color: var(--bg);
      border-color: transparent;
    }
    .kb-coltabs button span {
      opacity: 0.7;
    }
    .kb-cols {
      gap: 10px;
      padding: 0 14px 14px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .col {
      flex: 0 0 calc(100cqw - 40px);
      max-width: none;
      scroll-snap-align: center;
    }
    .pal-scrim {
      padding: 0;
      backdrop-filter: none;
    }
    .palette {
      width: 100%;
      height: 100%;
      max-height: none;
      border: 0;
      border-radius: 0;
    }
    .p2-scroll {
      padding: 20px;
    }
  }
  @container app (width >= 640px) {
    .body {
      grid-template-columns: 64px minmax(0, 1fr);
    }
    .rail {
      display: flex;
    }
  }
  @container app (width >= 1024px) {
    .rail {
      display: none;
    }
    .sidebar {
      display: flex;
    }
    .body.notes {
      grid-template-columns: 248px minmax(0, 1fr) 272px;
    }
    .body.notes .pagelist {
      display: flex;
    }
    .body.board {
      grid-template-columns: 248px minmax(0, 1fr);
    }
    .body.board.card-open {
      grid-template-columns: 248px minmax(0, 1fr) 384px;
    }
    .body.board.card-open .kb-detail {
      display: flex;
    }
    .pal-body {
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    }
    .pal-preview {
      display: block;
    }
  }
  @container app (width >= 1920px) {
    .body.notes {
      grid-template-columns: 264px minmax(0, 1fr) 288px 300px;
    }
    .body.notes .inspector {
      display: flex;
    }
    .body.board {
      grid-template-columns: 264px minmax(0, 1fr);
    }
    .body.board.card-open {
      grid-template-columns: 264px minmax(0, 1fr) 420px;
    }
    .page-head {
      padding-left: 36px;
      padding-right: 36px;
    }
  }
  @container app (width >= 3200px) {
    .body.notes {
      grid-template-columns: 280px minmax(0, 1fr) minmax(0, 0.8fr) 300px 320px;
    }
    .body.notes .pane2 {
      display: flex;
    }
    .body.board {
      grid-template-columns: 280px minmax(0, 1fr);
    }
    .body.board.card-open {
      grid-template-columns: 280px minmax(0, 1fr) 460px minmax(0, 1000px);
    }
    .body.board.card-open .pane2 {
      display: flex;
    }
  }

  /* ================= Direction-specific details ================= */
  /* A · Ink */
  .device[data-dir='ink'] .sec-dot {
    width: 3px;
    height: 13px;
    border-radius: 2px;
  }
  .device[data-dir='ink'] .sec-sq {
    width: 3px;
    height: 14px;
    border-radius: 2px;
  }
  .device[data-dir='ink'] .sectab.active::after {
    content: '';
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: -1px;
    height: 2px;
    border-radius: 2px 2px 0 0;

    function hlInline(s) {
      return s.replace(
        /(`[^`]+`)|\*\*([^*]+)\*\*|\*([^*]+)\*|\[\[([^\]]+)\]\]|\[([^\]]+)\]\(([^)]+)\)|(^|\s)(#[a-z][\w-]*)/g,
        (m, code, bold, it, wiki, lt, lu, pre, tag) => {
          if (code) return `<span class="t-c">${code}</span>`;
          if (bold) return `<span class="t-p">**</span><span class="t-b">${bold}</span><span class="t-p">**</span>`;
          if (it) return `<span class="t-p">*</span><span class="t-i">${it}</span><span class="t-p">*</span>`;
          if (wiki) return `<span class="t-p">[[</span><span class="t-l">${wiki}</span><span class="t-p">]]</span>`;
          if (lt)
            return `<span class="t-p">[</span><span class="t-l">${lt}</span><span class="t-p">](</span><span class="t-u">${lu}</span><span class="t-p">)</span>`;
          return `${pre}<span class="t-tag">${tag}</span>`;
        },
      );
    }
    function hlCode(raw) {
      return esc(raw).replace(/('[^']*')|\b(const|let|await|return)\b|\b(\d+)\b/g, (m, s, k, n) =>
        s ? `<span class="t-str">${s}</span>` : k ? `<span class="t-kw">${k}</span>` : `<span class="t-num">${n}</span>`,
      );
    }
    function hlTable(raw, head, sep) {
      const parts = raw.split('|');
      return parts
        .map((p, i) => {
          if (i === 0 || i === parts.length - 1) return esc(p);
          if (sep) return `<span class="t-sep">${esc(p)}</span>`;
          return head ? `<span class="t-th">${esc(p)}</span>` : hlInline(esc(p));
        })
        .join('<span class="t-pipe">|</span>');
    }
    const SEP_RE = /^\|[\s:|-]+\|$/;
    function hlLines(lines) {
      let fm = false;
      let code = false;
      return lines.map((raw, i) => {
        let h;
        let kind = '';
        let fold = false;
        if (i === 0 && raw === '---') {
          fm = true;
          fold = true;
          kind = 'meta';
          h = '<span class="t-p">---</span>';
        } else if (fm) {
          kind = 'meta';
          if (raw === '---') {
            fm = false;
            h = '<span class="t-p">---</span>';
          } else {
            h = esc(raw).replace(/^([\w-]+)(:)(.*)$/, '<span class="t-key">$1</span><span class="t-p">$2</span><span class="t-meta">$3</span>');
          }
        } else if (raw.startsWith('```')) {
          code = !code;
          fold = code;
          kind = 'fence';
          h = `<span class="t-p">\`\`\`</span><span class="t-lang">${esc(raw.slice(3))}</span>`;
        } else if (code) {
          kind = 'code';
          h = hlCode(raw);
        } else if (/^#{1,6} /.test(raw)) {
          const m = raw.match(/^(#{1,6} )(.*)$/);
          kind = 'h';
          fold = true;
          h = `<span class="t-hm">${m[1]}</span><span class="t-h">${hlInline(esc(m[2]))}</span>`;
        } else if (raw.startsWith('|')) {
          kind = 'table';
          const sep = SEP_RE.test(raw);
          h = hlTable(raw, !sep && SEP_RE.test(lines[i + 1] || ''), sep);
        } else if (raw.startsWith('> ')) {
          kind = 'quote';
          const rest = raw.slice(2);
          h =
            '<span class="t-p">&gt; </span>' +
            (rest.startsWith('[!') ? `<span class="t-callout">${esc(rest)}</span>` : `<span class="t-q">${hlInline(esc(rest))}</span>`);
        } else if (/^- \[[ x]\] /.test(raw)) {
          const done = raw[3] === 'x';
          kind = 'task';
          h = `<span class="t-p">- </span><span class="t-task">${esc(raw.slice(2, 5))}</span> <span class="${done ? 't-done' : ''}">${hlInline(esc(raw.slice(6)))}</span>`;
        } else {
          h = hlInline(esc(raw));
        }
        return { h, kind, fold };
      });
    }

          .map(([id, name]) => `<button class="row indent-1${S.screen === 'kanban' && id === 'relaunch' ? ' active' : ''}" data-board="${id}"><i class="sec-sq"></i><span class="rl">${name}</span></button>`)

        ${['team', 'archive'].map(tab).join('')}

      </div>`;
    }

    /* ---------- notes ---------- */
    function pageHead(md) {
      const phone = bp() === 'phone';
      let seg = '';
      if (md) {
        seg = phone
          ? `<div class="mini-seg"><button data-ptab="write" aria-pressed="${S.phoneTab === 'write'}">Write</button><button data-ptab="preview" aria-pressed="${S.phoneTab === 'preview'}">Preview</button></div>`
          : `<div class="mini-seg" role="group" aria-label="View">${[
              ['source', 'code', 'Source'],
              ['split', 'columns-2', 'Split'],
              ['preview', 'eye', 'Preview'],
            ]
              .map(([v, i, l]) => `<button data-view="${v}" aria-pressed="${S.mdView === v}">${ic(i)}${l}</button>`)
              .join('')}</div>`;
      }
      const tags = md ? ['roadmap', 'q4'] : ['research', 'competitors'];
      return `<div class="page-head">
        <div class="ph-row">
          <h1 class="page-title">${md ? 'Q4 roadmap' : 'Competitor notes'}</h1>
          <div class="ph-actions">
            ${seg}
            <button class="icon-btn hide-phone" title="Version history">${ic('history')}</button>
            ${md ? `<button class="icon-btn hide-phone" title="Export">${ic('download')}</button>` : ''}
            <button class="icon-btn" title="More">${ic('ellipsis')}</button>
          </div>
        </div>
        <div class="ph-meta">
          <span class="chip">${ic(md ? 'file-code' : 'pilcrow')}${md ? 'Markdown' : 'Rich text'}</span>
          <span>${md ? 'Tuesday 29 September 2026, 10:42' : 'Tuesday 29 September 2026, 09:05'}</span>
          ${tags.map((t) => `<span class="tag">#${t}</span>`).join('')}
          <span class="bl hide-phone">${ic('link-2')}${md ? '3 backlinks' : '2 backlinks'}</span>
        </div>
      </div>`;
    }
    function mdEditor() {
      const phone = bp() === 'phone';
      const view = phone ? (S.phoneTab === 'write' ? 'source' : 'preview') : S.mdView;
      S.lines = [...MD_TOP, ...(S.messy ? TABLE_MESSY : TABLE_OK), ...MD_BOTTOM];
      const hl = hlLines(S.lines);
      const src = hl
        .map(
          (l, i) =>
            `<div class="md-line${l.kind ? ' k-' + l.kind : ''}${i === S.curLine ? ' cur' : ''}${S.flash && l.kind === 'table' ? ' flash' : ''}" data-line="${i}"><span class="gut">${i + 1}</span><span class="fold">${l.fold ? ic('chevron-down') : ''}</span><span class="code">${l.h || ' '}</span></div>`,
        )
        .join('');
      const acc = [
        ['heading-2', 'Heading'], ['bold', 'Bold'], ['italic', 'Italic'], ['list', 'List'], ['list-checks', 'Task'],

      ];
      return `${pageHead(true)}
        <div class="md-wrap">
          <div class="md-split" data-view="${view}">

            <article class="md-preview" data-keep="prev"><div class="prose">${MD_PREVIEW}</div></article>
          </div>
          ${phone && view === 'source' ? `<div class="accessory" role="toolbar" aria-label="Formatting">${acc.map(([i, l]) => `<button aria-label="${l}">${ic(i)}</button>`).join('')}</div>` : ''}
