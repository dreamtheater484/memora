            <span id="lnCol">${lnCol()}</span>
            <span>186 words</span>
            <button class="sb-btn ${S.messy ? 'warn' : 'ok'}" data-act="align" title="Markdown tables are aligned automatically as you type">${ic(S.messy ? 'triangle-alert' : 'table')}${S.messy ? 'Table not aligned · Align now (Shift+Alt+F)' : 'Tables aligned'}</button>
            <span class="sp"></span>
            <span class="hide-tablet">Markdown</span><span class="hide-tablet">UTF-8</span><span class="hide-tablet">LF</span>
            <button class="sb-btn" data-act="wrap">${ic('wrap-text')}Wrap ${S.wrap ? 'on' : 'off'}</button>
          </div>
        </div>`;
    }
    const lnCol = () => `Ln ${S.curLine + 1}, Col ${(S.lines[S.curLine] || '').length + 1}`;
    function richEditor() {
      const tb = (i, l, on) => `<button class="icon-btn${on ? ' on' : ''}" title="${l}" aria-label="${l}">${ic(i)}</button>`;
      return `<div class="rt-toolbar" role="toolbar" aria-label="Formatting">
          <div class="rt-tools">
            ${tb('undo-2', 'Undo')}${tb('redo-2', 'Redo')}<span class="tb-sep"></span>
            <button class="tb-select">Heading 2 ${ic('chevron-down', 'sm')}</button><span class="tb-sep"></span>
            ${tb('bold', 'Bold', 1)}${tb('italic', 'Italic')}${tb('underline', 'Underline')}${tb('strikethrough', 'Strikethrough')}
            ${tb('highlighter', 'Highlight')}${tb('baseline', 'Text colour')}<span class="tb-sep"></span>
            ${tb('list', 'Bulleted list')}${tb('list-ordered', 'Numbered list')}${tb('list-checks', 'Checklist')}<span class="tb-sep"></span>
            ${tb('align-left', 'Align left', 1)}${tb('align-center', 'Centre')}<span class="tb-sep"></span>
            ${tb('link', 'Link')}${tb('image', 'Image')}${tb('table', 'Table')}${tb('text-quote', 'Quote')}

          <div class="rt-right">
            <button class="btn sm" data-act="export" aria-expanded="${S.exportOpen}">${ic('download')}<span class="hide-phone">Export</span>${ic('chevron-down', 'sm')}</button>
            ${S.exportOpen ? exportMenu() : ''}
          </div>
        </div>
        <div class="rt-scroll" data-keep="rt"><div class="rt-page">${pageHead(false)}<div class="rt-doc prose">${RICH_DOC}</div></div></div>`;
    }
    function exportMenu() {
      return `<div class="menu" role="menu">
        <div class="menu-label">Export this page</div>
        <button role="menuitem" data-export="Competitor notes.docx">${ic('file-text')}Word document<span class="sub">.docx</span></button>
        <button role="menuitem" data-export="Competitor notes.pdf">${ic('file-text')}PDF<span class="sub">.pdf</span></button>
        <button role="menuitem" data-export="Competitor notes.md">${ic('file-code')}Markdown<span class="sub">.md</span></button>
        <button role="menuitem" data-export="Competitor notes.html">${ic('code')}Web page<span class="sub">.html</span></button>
        <hr>
        <button role="menuitem" data-export="Research.memora">${ic('folder')}Whole section…<span class="sub">.memora</span></button>
        <button role="menuitem" data-export="print">${ic('printer')}Print…<span class="sub">Ctrl P</span></button>
      </div>`;
    }
    function emptyMain(sec) {
      return `<div class="empty ${hc(sec)}" style="${hs(sec)}">
        <div class="empty-art"><i></i><i></i><i>${ic('file-plus')}</i></div>
        <h2>No pages in ${SECS[sec].name} yet</h2>
        <p>Start with a blank page or pick a template. Markdown and rich text are both one click away.</p>
        <div class="actions"><button class="btn primary">${ic('file-plus')}New page</button><button class="btn">${ic('layout-template')}From a template</button></div>
        <p class="hint">Or drop .md, .docx or .memora files here to import them.</p>
      </div>`;
    }
    function pane2(board) {
      const drn = !board && S.screen !== 'rich';
      const title = drn ? 'Design review notes' : 'Q4 roadmap';
      const body = drn ? DRN_HTML : `<h1>Q4 roadmap</h1><p class="p2-meta">Roadmap · ${board ? 'opened from WEB-14' : 'edited 2 min ago'}</p>${MD_PREVIEW}`;
      return `<section class="pane pane2" aria-label="Second pane">
        <div class="pane2-head"><i class="sec-dot hue" style="--h:255"></i><span>Roadmap</span>${ic('chevron-right', 'sm')}<b>${title}</b><span class="chip">${ic('eye')}Preview</span><span class="sp"></span>
          <button class="icon-btn" title="Swap panes">${ic('arrow-left-right')}</button><button class="icon-btn" title="Open in the main pane">${ic('maximize-2')}</button><button class="icon-btn" title="Close pane">${ic('x')}</button></div>
        <div class="p2-scroll" data-keep="p2"><div class="prose">${body}</div></div>
      </section>`;
    }
    function pagelist(sec) {
      const pages = PAGES[sec] || [];
      const cur = sec === 'roadmap' ? 'q4' : sec === 'research' ? 'comp' : null;
      return `<aside class="pagelist ${hc(sec)}" style="${hs(sec)}" aria-label="Pages">
        <div class="pl-head"><div><h3><i class="sec-dot"></i>${SECS[sec].name}</h3><span class="sub">${pages.length} pages</span></div><span class="sp"></span>
          <button class="icon-btn" title="Sort">${ic('arrow-up-down')}</button><button class="btn sm primary">${ic('plus')}Page</button></div>
        <label class="pl-filter">${ic('list-filter')}<input placeholder="Filter pages" aria-label="Filter pages"></label>
        <div class="pl-list" data-keep="pl">${
          pages.length
            ? pages
                .map(
                  (p) =>
                    `<button class="pg${p.sub ? ' sub' : ''}${p.id === cur ? ' active' : ''}" data-page="${p.id}"><span class="t">${ic(p.kind === 'md' ? 'file-code' : 'file-text')}<span class="tt">${p.title}</span></span><span class="s">${p.snip}</span><span class="m">${p.t}</span></button>`,
                )
                .join('')
            : '<div class="pl-empty">No pages yet</div>'
        }</div>
      </aside>`;
    }
    function inspector(sec) {
      if (!PAGES[sec]) return '<aside class="inspector"></aside>';
      const md = sec === 'roadmap';
      const outline = md
        ? [['Milestones', 2], ['This week', 2], ['Notes', 2]]
        : [['Landscape', 2], ['Onboarding, as seen in Quillbox', 2], ['Takeaways', 3]];
      const bl = md
        ? [['Design review notes', 'Roadmap', '…dates live in <b>Q4 roadmap</b>, decisions here.'], ['Standup — Sep 28', 'Meetings', '…see <b>Q4 roadmap</b> for the milestones.']]
        : [['Interview synthesis', 'Research', '…compare with <b>Competitor notes</b>.'], ['Pricing experiments', 'Roadmap', '…benchmarks in <b>Competitor notes</b>.']];
      return `<aside class="inspector" aria-label="Page details" data-keep="insp">
        <section class="insp-sec"><h4 class="insp-h">Outline</h4><nav class="outline">${outline.map(([t, l], i) => `<a class="l${l}${i === 0 ? ' on' : ''}">${t}</a>`).join('')}</nav></section>
        <section class="insp-sec"><h4 class="insp-h">Backlinks <span>${bl.length + (md ? 1 : 0)}</span></h4>
          ${bl.map(([t, s, x]) => `<div class="blink">${ic('file-text')}<span>${t}<small>${s} · ${x}</small></span></div>`).join('')}
          ${md ? `<div class="blink">${ic('square-kanban')}<span>WEB-14 · Offline outbox for the editor<small>Website relaunch · In progress</small></span></div>` : ''}
        </section>
        <section class="insp-sec"><h4 class="insp-h">Tags</h4><div class="tags">${(md ? ['roadmap', 'q4', 'docs'] : ['research', 'competitors']).map((t) => `<span class="chip">#${t}</span>`).join('')}</div></section>
        <section class="insp-sec"><h4 class="insp-h">Version history <button class="linkish">Compare</button></h4>
          <ol class="revs">
            <li class="on"><b>Today, 10:42</b>You · current version</li>
            <li><b>Today, 09:15</b>You · 14 lines changed</li>
            <li><b>Yesterday, 17:03</b>Priya · table updated</li>
            <li><b>26 Sep, 11:20</b>Imported from Markdown</li>
          </ol></section>
        <section class="insp-sec"><h4 class="insp-h">Info</h4><dl class="info"><dt>Created</dt><dd>3 Sep 2026</dd><dt>Words</dt><dd>${md ? 186 : 212}</dd><dt>Revision</dt><dd>42</dd><dt>Format</dt><dd>${md ? 'Markdown' : 'Rich text'}</dd></dl></section>
      </aside>`;

    function notesArea() {
      const sec = curSec();
      const body = sec === 'roadmap' ? mdEditor() : sec === 'research' ? richEditor() : emptyMain(sec);

    /* ---------- kanban ---------- */
    const colOf = (id) => COLS.find((c) => c.cards.includes(id));
    function cardHtml(id) {
      const c = CARDS[id];
      const notes = (S.linked[id] || []).length;
      const check = id === 'WEB-14' ? [S.check14.filter((x) => x.done).length, S.check14.length] : c.check;
      const lbls = c.labels.map((l) => `<span class="lbl hue" style="--h:${LABELS[l][1]}">${LABELS[l][0]}</span>`).join('');
      const meta = [
        c.due ? `<span class="b due ${c.due[1]}">${ic('calendar')}${c.due[0]}</span>` : '',
        check ? `<span class="b${check[0] === check[1] ? ' ok' : ''}">${ic('list-checks')}${check[0]}/${check[1]}</span>` : '',
        c.comments ? `<span class="b">${ic('message-square')}${c.comments}</span>` : '',
        notes ? `<span class="b" title="Linked notes">${ic('file-text')}${notes}</span>` : '',
      ].join('');
      const accent = `--card-accent: oklch(0.64 0.15 ${LABELS[c.labels[0]][1]})`;
      return `<div class="card${S.card === id ? ' sel' : ''}" style="${accent}" draggable="${bp() !== 'phone'}" data-card="${id}" tabindex="0" role="button" aria-label="${esc(c.title)}">
        <div class="labels">${lbls}</div><div class="ttl">${esc(c.title)}</div>
        <div class="meta"><span class="cid">${id}</span>${meta}<span class="avs">${(c.who || []).map((p) => avatar(p, 'xs')).join('')}</span></div></div>`;
    }
    function colHtml(col) {
      const over = col.wip && col.cards.length > col.wip;
      return `<section class="col hue${col.neutral ? ' neutral' : ''}${col.id === 'done' ? ' done' : ''}" style="--h:${col.h}" data-col="${col.id}" aria-label="${col.name}">
        <header class="col-head"><i class="sec-dot"></i><span>${col.name}</span><span class="n">${col.cards.length}</span>${col.wip ? `<span class="wip${over ? ' over' : ''}" title="Work-in-progress limit">${col.cards.length}/${col.wip}</span>` : ''}<span class="sp"></span>
          <button class="icon-btn xs" aria-label="Add card">${ic('plus')}</button><button class="icon-btn xs" aria-label="Column menu">${ic('ellipsis')}</button></header>
        <div class="col-body" data-keep="col-${col.id}">${col.cards.map(cardHtml).join('')}</div>
        <button class="add-card">${ic('plus')}Add card</button>
      </section>`;
    }
    function boardArea() {
      const p = PROJECTS[0];
      return `<section class="pane board" aria-label="Board">
        <div class="kb-head">
          <div class="kb-title-row">
            <span class="kb-crumb hue hide-phone" style="--h:${p.h}"><i class="sec-dot"></i>Website ${ic('chevron-right', 'sm')}</span>
            <h1 class="kb-title">Website relaunch</h1>
            <button class="icon-btn hide-phone" aria-label="Favourite">${ic('star')}</button>
            <span class="sp"></span>
            <span class="avs hide-phone">${['AM', 'SK', 'PR', 'JO'].map((x) => avatar(x)).join('')}</span>
            <button class="btn primary sm">${ic('plus')}<span class="hide-phone">Card</span></button>
          </div>
          <div class="kb-tabs hide-phone" role="tablist">${p.boards.map(([id, name], i) => `<button class="kb-tab${i === 0 ? ' on' : ''}" data-board="${id}">${name}</button>`).join('')}<button class="kb-tab" aria-label="New board">${ic('plus')}</button></div>
          <div class="kb-tools">
            <label class="kb-filter">${ic('search')}<input placeholder="Filter cards" aria-label="Filter cards"></label>
            <button class="chip-btn hide-phone">${ic('tag')}Label${ic('chevron-down')}</button>
            <button class="chip-btn hide-phone">${ic('users')}Assignee${ic('chevron-down')}</button>
            <button class="chip-btn hide-tablet">${ic('calendar')}Due${ic('chevron-down')}</button>
            <span class="sp"></span>
            <div class="mini-seg hide-phone"><button aria-pressed="true">${ic('columns-3')}Board</button><button aria-pressed="false">${ic('rows-3')}List</button></div>
          </div>
        </div>
        <div class="kb-coltabs" role="tablist">${COLS.map((c, i) => `<button data-coltab="${i}" class="${i === 0 ? 'on' : ''}">${c.name}<span>${c.cards.length}</span></button>`).join('')}</div>
        <div class="kb-cols" data-keep="cols">${COLS.map(colHtml).join('')}</div>
      </section>${cardDetail()}${pane2(true)}`;
    }
    function cardDetail() {
      const id = S.card;
      if (!id) return '<aside class="kb-detail"></aside>';
      const c = CARDS[id];
      const col = colOf(id);
      const checks = id === 'WEB-14' ? S.check14 : [];
      const done = checks.filter((x) => x.done).length;
      const linked = S.linked[id] || [];
      const desc =
        id === 'WEB-14'
          ? '<p>Queue edits locally when the connection drops, and replay them in order once it returns. The save status must always tell the truth.</p><p>Spec: <a class="wikilink">Offline mode — spec</a></p>'
          : '<p class="muted">No description yet. Markdown is supported.</p>';
      const noteLink = (nid) => {
        const n = NOTES.find((x) => x.id === nid);
        return `<div class="note-link ${hc(n.sec)}" style="${hs(n.sec)}"><span class="nl-ic">${ic('file-text')}</span><span class="nl-main"><span class="nt">${n.title}</span><span class="ns">${SECS[n.sec].name} · edited ${n.t}</span></span>
          <button class="icon-btn xs" title="Open in a new pane">${ic('square-arrow-out-up-right')}</button><button class="icon-btn xs" data-unlink="${nid}" title="Unlink">${ic('x')}</button></div>`;
      };
      return `<aside class="kb-detail" aria-label="Card details">
        <div class="kd-head"><span class="kd-id">${id}</span><button class="status-pill hue${col.neutral ? ' neutral' : ''}" style="--h:${col.h}"><i class="sec-dot"></i>${col.name}${ic('chevron-down', 'sm')}</button><span class="sp"></span>
          <button class="icon-btn" title="Copy link">${ic('link')}</button><button class="icon-btn" title="More">${ic('ellipsis')}</button><button class="icon-btn" data-act="close-card" title="Close">${ic('x')}</button></div>
        <div class="kd-scroll" data-keep="kd-${id}">
          <h2 class="kd-title">${esc(c.title)}</h2>
          <dl class="props">
            <dt>${ic('users')}Assignees</dt><dd>${(c.who || []).map((p) => avatar(p, 'xs') + `<span>${PEOPLE[p].name}</span>`).join('') || '<span class="muted">Nobody yet</span>'}</dd>

            <dt>${ic('tag')}Labels</dt><dd>${c.labels.map((l) => `<span class="lbl hue" style="--h:${LABELS[l][1]}">${LABELS[l][0]}</span>`).join('')}</dd>

          ${
            checks.length
              ? `<section class="kd-sec"><h4>Checklist <span class="muted">${done}/${checks.length}</span></h4><div class="progress"><i style="width:${(done / checks.length) * 100}%"></i></div>
                <ul class="tasks">${checks.map((x, i) => `<li class="${x.done ? 'done' : ''}" data-check="${i}"><span class="cb${x.done ? ' on' : ''}">${x.done ? CHECK : ''}</span><span>${x.t}</span></li>`).join('')}</ul></section>`
              : ''
          }
          <section class="kd-sec"><h4>Linked notes <span class="muted">${linked.length}</span></h4>
            ${linked.map(noteLink).join('')}
            ${S.picker ? picker() : `<button class="btn ghost" data-act="picker">${ic('plus')}Link a note</button>`}
          </section>
          <section class="kd-sec"><h4>Activity</h4>
            <ol class="activity">
              <li>${avatar('SK', 'xs')}<span><b>Sam</b> moved this from To do to In progress <small>· 2 h ago</small></span></li>
              <li>${avatar('PR', 'xs')}<span><b>Priya</b> linked Design review notes <small>· yesterday</small></span></li>
            </ol>
            <div class="comment-box">${avatar('AM', 'xs')}<span class="fake-in">Write a comment…</span></div>
          </section>
        </div>
      </aside>`;
    }
    function picker() {
      return `<div class="picker" role="dialog" aria-label="Link a note">
        <label class="picker-in">${ic('search')}<input id="pickerInput" value="${esc(S.pickerQ)}" placeholder="Search notes…" autocomplete="off" spellcheck="false"><kbd>Esc</kbd></label>
        <div class="picker-list" id="pickerList">${pickerResults()}</div>
        <div class="picker-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>↵</kbd> link</span><span class="sp"></span><span>Results update as you type</span></div>
      </div>`;
    }
    function pickerResults() {
      const q = S.pickerQ.trim().toLowerCase();
      const linked = S.linked[S.card] || [];
      let list = NOTES.filter((n) => !linked.includes(n.id));
      if (q) list = list.filter((n) => (n.title + ' ' + SECS[n.sec].name).toLowerCase().includes(q));
      S.pick = list.slice(0, 7);
      if (S.pickerSel >= S.pick.length) S.pickerSel = 0;
      if (!S.pick.length) return `<div class="picker-empty">No notes match “${esc(S.pickerQ)}”. <button class="linkish">Create a page with this name</button></div>`;
      return (
        `<div class="picker-group">${q ? 'Best matches' : 'Recent'}</div>` +
        S.pick
          .map(
            (n, i) =>
              `<button class="picker-item${i === S.pickerSel ? ' sel' : ''}" data-pick="${n.id}"><i class="sec-dot ${hc(n.sec)}" style="${hs(n.sec)}"></i><span class="pi-t">${hi(n.title, q)}</span><span class="pi-s">${SECS[n.sec].name} · ${n.t}</span></button>`,
          )
          .join('')
      );
    }

    /* ---------- command palette ---------- */
    function palette() {
      return `<div class="pal-scrim" data-act="pal-bg">
        <div class="palette" role="dialog" aria-label="Search and commands">
          <div class="pal-input">${ic('search')}<input id="palInput" value="${esc(S.pq)}" placeholder="Search pages, cards, tags and commands" autocomplete="off" spellcheck="false" aria-label="Search"><button class="kbd-btn" data-act="pal-close" aria-label="Close"><kbd>Esc</kbd></button></div>
          <div class="pal-scopes" id="palScopes"></div>
          <div class="pal-body"><div class="pal-list" id="palList" role="listbox"></div><div class="pal-preview" id="palPrev"></div></div>
          <div class="pal-foot hide-phone"><span><kbd>↑</kbd><kbd>↓</kbd> Move</span><span><kbd>↵</kbd> Open</span><span><kbd>Ctrl</kbd><kbd>↵</kbd> Open in a new pane</span><span class="sp"></span><span>312 pages · 58 cards indexed</span></div>
        </div>
      </div>`;
    }
    function updatePalette() {
      const q = S.pq.trim().toLowerCase();
      let items = q ? PAL.filter((it) => (it.title + ' ' + it.path + ' ' + it.text).toLowerCase().includes(q)) : PAL.filter((it) => it.recent);
      const counts = { all: items.length, page: 0, card: 0, tag: 0, cmd: 0 };
      items.forEach((it) => counts[it.type]++);
      if (S.pscope !== 'all') items = items.filter((it) => it.type === S.pscope);
      S.pal = items;
      if (S.psel >= items.length) S.psel = Math.max(0, items.length - 1);
      const scopes = [['all', 'All'], ['page', 'Pages'], ['card', 'Cards'], ['tag', 'Tags'], ['cmd', 'Commands']];
      $('#palScopes').innerHTML =
        scopes.map(([k, l]) => `<button class="scope${S.pscope === k ? ' on' : ''}" data-scope="${k}">${l}<span>${counts[k]}</span></button>`).join('') +
        `<span class="sp"></span><span class="pal-hint hide-phone">${q ? 'Matching titles and text' : 'Recent'}</span>`;
      const GN = { page: q ? 'Pages' : 'Recent', card: 'Cards', tag: 'Tags', cmd: 'Commands' };
      let html = '';
      let last = '';
      items.forEach((it, i) => {
        if (it.type !== last) html += `<div class="pal-group">${GN[it.type]}</div>`;
        last = it.type;
        html += palItem(it, i, q);
      });
      $('#palList').innerHTML =
        html || `<div class="pal-empty">${ic('search')}<b>No results for “${esc(S.pq)}”</b><span>Try fewer words, or type # to search tags.</span></div>`;
      $('#palPrev').innerHTML = items[S.psel] ? palPreview(items[S.psel], q) : '';
      const sel = $('#palList .sel');
      if (sel) sel.scrollIntoView({ block: 'nearest' });
    }
    function palItem(it, i, q) {
      let lead;
      if (it.type === 'page') lead = `<span class="pal-ic ${hc(it.sec)}" style="${hs(it.sec)}">${ic('file-text')}</span>`;
      else if (it.type === 'card') lead = `<span class="pal-ic">${ic('square-kanban')}</span>`;
      else if (it.type === 'tag') lead = `<span class="pal-ic">${ic('hash')}</span>`;
      else lead = `<span class="pal-ic">${ic(it.icon)}</span>`;
      const snip = it.type === 'page' || it.type === 'card' ? `<span class="ps">${hi(it.text, q)}</span>` : '';
      const right =
        it.type === 'page' ? `<span class="pal-when">${it.when}</span>` : it.type === 'card' ? `<span class="pal-id">${it.id}</span>` : it.key ? `<kbd>${it.key}</kbd>` : '';
      return `<div class="pal-item${i === S.psel ? ' sel' : ''}" role="option" aria-selected="${i === S.psel}" data-pal="${i}">${lead}<span class="pal-main"><span class="pt">${hi(it.title, q)}</span><span class="pp">${esc(it.path)}</span>${snip}</span>${right}</div>`;
    }
    function palPreview(it, q) {
      if (it.type === 'page') {
        return `<div class="pv-path"><i class="sec-dot ${hc(it.sec)}" style="${hs(it.sec)}"></i>${esc(it.path)}</div>
          <h3 class="pv-title">${hi(it.title, q)}</h3><div class="pv-meta">Edited ${it.when}</div>
          <div class="prose sm"><p>${hi(it.text, q)}</p>${it.id === 'q4' ? '<p class="muted">+ 3 more matches: table, tasks, code block</p>' : ''}</div>
          <div class="pv-actions"><button class="btn primary sm" data-pal="${S.psel}">Open</button><button class="btn sm">${ic('columns-2')}Open in a new pane</button></div>`;
      }
      if (it.type === 'card') {
        return `<div class="pv-path">${ic('square-kanban', 'sm')}${esc(it.path)}</div><h3 class="pv-title">${hi(it.title, q)}</h3><div class="pv-meta">${it.id}</div>
          <div class="prose sm"><p>${hi(it.text, q)}</p></div><div class="pv-actions"><button class="btn primary sm" data-pal="${S.psel}">Open card</button></div>`;
      }
      if (it.type === 'tag') {
        return `<h3 class="pv-title">${esc(it.title)}</h3><div class="pv-meta">${esc(it.path)}</div>
          ${['Q4 roadmap', 'Offline mode — spec', 'Design review notes'].map((t) => `<div class="blink">${ic('file-text')}<span>${t}</span></div>`).join('')}`;
      }
      return `<h3 class="pv-title">${esc(it.title)}</h3><div class="pv-meta">${esc(it.path)}</div><p class="muted">Press Enter to run this command.</p>`;
    }
    function openPal(it) {
      if (!it) return;
      if (it.type === 'page') {
        if (it.id === 'comp') return setScreen('rich');
        setScreen('md');
        if (it.id !== 'q4') toast(`“${it.title}” isn't in the mockup, so here is Q4 roadmap`);
      } else if (it.type === 'card') {
        setScreen('kanban');
        S.card = it.id;
        render();
      } else if (it.id === 'theme') {
        setTheme(S.theme === 'dark' ? 'light' : 'dark');
        setScreen('md');
      } else {
        setScreen('md');
        toast(`${it.title.replace('…', '')}: not part of the mockup`);
      }
    }

    /* ---------- render ---------- */
    function bottomNav() {
      const notes = S.screen === 'md' || S.screen === 'rich';
      return `<nav class="bnav" aria-label="Primary">
        <button class="${notes ? 'on' : ''}" data-screen="md">${ic('notebook')}<span>Notes</span></button>
        <button data-act="pages">${ic('file-text')}<span>Pages</span></button>
        <button class="${S.screen === 'kanban' ? 'on' : ''}" data-screen="kanban">${ic('square-kanban')}<span>Boards</span></button>
        <button class="${S.screen === 'search' ? 'on' : ''}" data-screen="search">${ic('search')}<span>Search</span></button>
      </nav>`;
    }
    function render() {
      const keep = {};
      app.querySelectorAll('[data-keep]').forEach((el) => (keep[el.dataset.keep] = [el.scrollLeft, el.scrollTop]));
      S.bp = bp();
      const board = S.screen === 'kanban';
      const sec = curSec();
      const hue = board ? PROJECTS[0].h : SECS[sec].h;
      device.dataset.dir = S.dir;
      device.style.setProperty('--h', hue);
      device.style.setProperty('--ah', hue);
      device.style.setProperty('--nb-h', board ? PROJECTS[0].h : NOTEBOOKS[0].h);
      device.classList.toggle('neutral', !board && !!SECS[sec].neutral);
      const cls = ['body', board ? 'board' : 'notes', S.drawer && 'drawer', S.pages && !board && 'pages', board && S.card && 'card-open'];
      const overlay = S.drawer || (S.pages && !board) || (board && S.card);
      app.innerHTML =
        topbar() +
        `<div class="${cls.filter(Boolean).join(' ')}">${rail()}${sidebar()}${board ? boardArea() : notesArea()}${overlay ? '<div class="scrim" data-act="close-overlays"></div>' : ''}</div>` +
        bottomNav() +
        (S.screen === 'search' ? palette() : '') +
        `<div class="toast-host" id="toastHost"></div>`;
      app.querySelectorAll('[data-keep]').forEach((el) => {
        const v = keep[el.dataset.keep];
        if (v) [el.scrollLeft, el.scrollTop] = v;
      });
      if (S.screen === 'search') updatePalette();
      renderToast();
      syncReview();
    }
    function syncReview() {
      document.querySelectorAll('.seg').forEach((seg) => {
        const v = { dir: S.dir, screen: S.screen, theme: S.theme, device: S.device }[seg.dataset.key];
        seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
      });
      $('#rvNote').innerHTML = DIRS[S.dir] + `<span class="try">${TRY}</span>`;
    }
    let toastTimer;
    function toast(msg) {
      S.toast = msg;
      clearTimeout(toastTimer);
      renderToast();
      toastTimer = setTimeout(() => {
        S.toast = null;
        renderToast();
      }, 2800);
    }
    function renderToast() {
      const host = $('#toastHost');
      if (host) host.innerHTML = S.toast ? `<div class="toast" role="status">${ic('info')}<span>${esc(S.toast)}</span></div>` : '';
    }

    /* ---------- actions ---------- */
    function setScreen(v) {
      S.screen = v;
      S.section = null;
      S.drawer = S.pages = S.exportOpen = S.picker = false;
      if (v === 'kanban') S.card = small() ? null : 'WEB-14';
      if (v === 'search') S.psel = 0;
      render();
      if (v === 'search') {
        const inp = $('#palInput');
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
      }
    }
    function setTheme(t) {
      S.theme = t;
      document.documentElement.dataset.theme = t;
      syncReview();
    }
    function openSection(id) {
      S.drawer = false;
      if (id === 'roadmap') return setScreen('md');
      if (id === 'research') return setScreen('rich');
      if (S.screen === 'kanban' || S.screen === 'search') S.screen = 'md';
      S.section = id;
      S.pages = false;
      render();
    }
    function alignTables() {
      S.messy = false;
      S.flash = true;
      render();
      S.flash = false;
      toast('Table aligned');
    }
    function moveCard(id, colId, beforeId) {
      const from = colOf(id);
      const to = COLS.find((c) => c.id === colId);
      if (!from || !to || id === beforeId) return;
      from.cards.splice(from.cards.indexOf(id), 1);
      const at = beforeId ? to.cards.indexOf(beforeId) : -1;
      if (at < 0) to.cards.push(id);
      else to.cards.splice(at, 0, id);
      if (from !== to) toast(`Moved ${id} to ${to.name}`);
    }
    function linkNote(nid) {
      const list = (S.linked[S.card] ||= []);
      if (!list.includes(nid)) list.push(nid);
      S.picker = false;
      render();
      toast(`Linked “${NOTES.find((n) => n.id === nid).title}” to ${S.card}`);
    }
    function openPicker() {
      S.picker = true;
      S.pickerQ = '';
      S.pickerSel = 0;
      render();
      $('#pickerInput')?.focus();
    }

    document.addEventListener('click', (e) => {
      const seg = e.target.closest('.seg button');
      if (seg) {
        const key = seg.parentElement.dataset.key;
        const v = seg.dataset.v;
        if (key === 'dir') {
          S.dir = v;
          render();
        } else if (key === 'screen') setScreen(v);
        else if (key === 'theme') setTheme(v);
        else if (key === 'device') {
          S.device = v;
          fitFrame();
          render();
        }
        return;
      }
      if (!app.contains(e.target)) return;
      if (S.exportOpen && !e.target.closest('.rt-right')) {
        S.exportOpen = false;
        render();
        return;
      }
      const t = e.target.closest(
        '[data-act],[data-screen],[data-sec],[data-page],[data-nb],[data-board],[data-card],[data-check],[data-pick],[data-unlink],[data-pal],[data-scope],[data-line],[data-coltab],[data-view],[data-ptab],[data-export]',
      );
      if (!t) return;
      const d = t.dataset;
      if (d.act) {
        switch (d.act) {
          case 'save':
            S.save = (S.save + 1) % SAVE.length;
            return render();
          case 'drawer':
            S.drawer = !S.drawer;
            S.pages = false;
            return render();
          case 'pages':
            if (S.screen === 'kanban' || S.screen === 'search') setScreen('md');
            S.pages = !S.pages;
            S.drawer = false;
            return render();
          case 'palette':
            return setScreen('search');
          case 'pal-close':
            return setScreen('md');
          case 'pal-bg':
            if (e.target === t) setScreen('md');
            return;
          case 'close-overlays':
            S.drawer = S.pages = false;
            if (S.screen === 'kanban') S.card = null;
            return render();
          case 'close-card':
            S.card = null;
            S.picker = false;
            return render();
          case 'align':
            if (S.messy) return alignTables();
            S.messy = true;
            render();
            return toast('Preview only: the table as typed, before auto-align');
          case 'wrap':
            S.wrap = !S.wrap;
            return render();
          case 'export':
            S.exportOpen = !S.exportOpen;
            return render();
          case 'picker':
            return openPicker();
        }
        return;
      }
      if (d.screen) return setScreen(d.screen);
      if (d.sec) return openSection(d.sec);
      if (d.page) {
        if (d.page === 'q4') return setScreen('md');
        if (d.page === 'comp') return setScreen('rich');
        return toast('Only “Q4 roadmap” and “Competitor notes” are mocked up');
      }
      if (d.nb) {
        S.openNb[d.nb] = !S.openNb[d.nb];
        return render();
      }
      if (d.board) return d.board === 'relaunch' ? (S.screen !== 'kanban' ? setScreen('kanban') : null) : toast('Only “Website relaunch” is mocked up');
      if (d.card) {
        S.card = d.card;
        S.picker = false;
        return render();
      }
      if (d.check) {
        const item = S.check14[+d.check];
        item.done = !item.done;
        return render();
      }
      if (d.pick) return linkNote(d.pick);
      if (d.unlink) {
        S.linked[S.card] = (S.linked[S.card] || []).filter((x) => x !== d.unlink);
        return render();
      }
      if (d.pal) return openPal(S.pal[+d.pal]);
      if (d.scope) {
        S.pscope = d.scope;
        S.psel = 0;
        updatePalette();
        return $('#palInput').focus();
      }
      if (d.line) {
        S.curLine = +d.line;
        app.querySelector('.md-line.cur')?.classList.remove('cur');
        t.classList.add('cur');
        $('#lnCol').textContent = lnCol();
        return;
      }
      if (d.coltab) {
        const col = app.querySelectorAll('.col')[+d.coltab];
        col?.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        return;
      }
      if (d.view) {
        S.mdView = d.view;
        return render();
      }
      if (d.ptab) {
        S.phoneTab = d.ptab;
        return render();
      }
      if (d.export) {
        S.exportOpen = false;
        render();
        return toast(d.export === 'print' ? 'Opens the print dialog' : `Exported ${d.export} (mockup)`);
      }
    });

    app.addEventListener('input', (e) => {
      const el = e.target;
      if (el.id === 'palInput') {
        S.pq = el.value;
        S.psel = 0;
        updatePalette();
      } else if (el.id === 'pickerInput') {
        S.pickerQ = el.value;
        S.pickerSel = 0;
        $('#pickerList').innerHTML = pickerResults();
      } else if (el.closest('.pl-filter')) {
        const q = el.value.trim().toLowerCase();
        app.querySelectorAll('.pg').forEach((p) => (p.style.display = p.textContent.toLowerCase().includes(q) ? '' : 'none'));
      } else if (el.closest('.kb-filter')) {
        const q = el.value.trim().toLowerCase();
        app.querySelectorAll('.card').forEach((c) => c.classList.toggle('hidden', !c.textContent.toLowerCase().includes(q)));
      }
    });

    document.addEventListener('keydown', (e) => {
      const k = e.key;
      if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'k') {
        e.preventDefault();
        return setScreen(S.screen === 'search' ? 'md' : 'search');
      }
      if (e.shiftKey && e.altKey && e.code === 'KeyF' && S.screen === 'md') {
        e.preventDefault();
        return S.messy ? alignTables() : toast('Tables are already aligned');
      }
      const id = e.target.id;
      if (id === 'palInput') {
        const n = S.pal.length;
        if ((k === 'ArrowDown' || k === 'ArrowUp') && n) {
          e.preventDefault();
          S.psel = (S.psel + (k === 'ArrowDown' ? 1 : -1) + n) % n;
          updatePalette();
        } else if (k === 'Enter') {
          e.preventDefault();
          if (e.ctrlKey || e.metaKey) toast('On wide screens this opens next to the current page');
          openPal(S.pal[S.psel]);
        } else if (k === 'Escape') {
          e.preventDefault();
          setScreen('md');
        }
        return;
      }
      if (id === 'pickerInput') {
        const n = S.pick.length;
        if ((k === 'ArrowDown' || k === 'ArrowUp') && n) {
          e.preventDefault();
          S.pickerSel = (S.pickerSel + (k === 'ArrowDown' ? 1 : -1) + n) % n;
          $('#pickerList').innerHTML = pickerResults();
        } else if (k === 'Enter' && n) {
          e.preventDefault();
          linkNote(S.pick[S.pickerSel].id);
        } else if (k === 'Escape') {
          e.preventDefault();
          S.picker = false;
          render();
        }
        return;
      }
      if (k === 'Enter' && e.target.matches?.('.card[data-card]')) {
        S.card = e.target.dataset.card;
        return render();
      }
      if (k === 'Escape') {
        if (S.screen === 'search') return setScreen('md');
        if (S.exportOpen || S.drawer || S.pages || S.picker) {
          S.exportOpen = S.drawer = S.pages = S.picker = false;
          return render();
        }
        if (S.screen === 'kanban' && S.card && small()) {
          S.card = null;
          render();
        }
      }
    });

    /* Drag and drop between columns (mouse; phones use tap to open). */
    app.addEventListener('dragstart', (e) => {
      const c = e.target.closest?.('.card[data-card]');
      if (!c) return;
      S.drag = c.dataset.card;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', S.drag);
      requestAnimationFrame(() => c.classList.add('dragging'));
    });
    app.addEventListener('dragend', () => {
      S.drag = null;
      app.querySelectorAll('.dragging, .drop').forEach((el) => el.classList.remove('dragging', 'drop'));
    });
    app.addEventListener('dragover', (e) => {
      const col = e.target.closest?.('.col');
      if (!col || !S.drag) return;
      e.preventDefault();
      app.querySelectorAll('.col.drop').forEach((el) => el !== col && el.classList.remove('drop'));
      col.classList.add('drop');
    });
    app.addEventListener('drop', (e) => {
      const col = e.target.closest?.('.col');
      if (!col || !S.drag) return;
      e.preventDefault();
      const before = e.target.closest('.card[data-card]')?.dataset.card;
      moveCard(S.drag, col.dataset.col, before);
      S.drag = null;
      render();
    });
    app.addEventListener(
      'scroll',
      (e) => {
        if (!e.target.classList?.contains('kb-cols')) return;
        const cols = e.target.querySelectorAll('.col');
        if (!cols.length) return;
        const w = cols[0].offsetWidth + 10;
        const i = Math.round(e.target.scrollLeft / w);
        app.querySelectorAll('.kb-coltabs button').forEach((b, j) => b.classList.toggle('on', i === j));
      },
      true,
    );

    /* ---------- preview frame ---------- */
    const SIZES = { phone: [390, 844, 'Phone'], desktop: [1440, 900, 'Desktop'], ultra: [5120, 1440, 'Ultra-wide'] };
    function fitFrame() {
      const dev = innerWidth < 760 ? 'fit' : S.device;
      const cap = $('#frameCap');
      if (dev === 'fit') {
        frame.className = 'frame fit';
        frame.removeAttribute('style');
        device.style.removeProperty('width');
        device.style.removeProperty('height');
        device.style.removeProperty('transform');
        cap.textContent = '';
        return;
      }
      const [w, h, name] = SIZES[dev];
      const st = $('#stage').getBoundingClientRect();
      const pad = dev === 'phone' ? 40 : 28;
      const s = Math.min(1, (st.width - pad * 2) / w, (st.height - pad * 2) / h);
      frame.className = 'frame framed';
      frame.dataset.device = dev;
      frame.style.width = w * s + 'px';
      frame.style.height = h * s + 'px';
      device.style.width = w + 'px';
      device.style.height = h + 'px';
      device.style.transform = `scale(${s})`;
      cap.textContent = `${name} · ${w} × ${h} · shown at ${Math.round(s * 100)}%`;
    }
    addEventListener('resize', () => {
      fitFrame();
      if (bp() !== S.bp) render();
    });
    new ResizeObserver(() => {
      if (bp() !== S.bp) render();
    }).observe(device);

    fitFrame();
    if (small()) S.card = null;
    render();
  })();
</script>
