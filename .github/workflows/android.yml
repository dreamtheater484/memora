name: Android

# Memora for Android (apps/android, docs/ANDROID.md): Node.js built for Android from the official
# source, and Memora's own server and web app inside an Android app, run on an emulator. It
# reports the APK sizes, the start-up times and the memory used, with screenshots, and checks
# that the page sees the app go to the background and come back.
#
# Pull requests and main build test APKs, signed with the runner's own debug key: their names end
# in -debug-key, and they install over no other build. The release workflow calls this one with
# `release: true`: its APKs are signed with Memora's key (docs/SIGNING.md#android), or it fails.

on:
  pull_request:
    paths:
      - .github/workflows/android.yml
      - apps/android/**
      # What the app bundles: the server and the web app, laid out by the desktop app's scripts.
      - apps/server/**
      - apps/web/**
      - packages/**
      - apps/desktop/build.mjs
      - apps/desktop/scripts/resources.mjs
      - scripts/licenses.mjs
      - pnpm-lock.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/android.yml
      - apps/android/**
      - apps/server/**
      - apps/web/**
      - packages/**
      - apps/desktop/build.mjs
      - apps/desktop/scripts/resources.mjs
      - scripts/licenses.mjs
      - pnpm-lock.yaml
  # Only main's caches reach a release (see the node job), and GitHub drops a cache after 7 days
  # unused: twice a week, main's run reads them, and builds nothing else.
  schedule:
    - cron: '23 4 * * 1,4'
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Sign with Memora's key (docs/SIGNING.md#android), and fail without it
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  # The workflow's name is the caller's when the release calls this one: its own group, then.
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_ANDROID: 24.21.0
  # NDK r29 (sdkmanager's package name), and the oldest Android the app runs on (8.0).
  NDK_PACKAGE: ndk;29.0.14206865
  ANDROID_API: 26
  BUILD_TOOLS: 35.0.0

jobs:
  node:
    name: Node.js for Android (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v7
      # A new build only when the version or the recipe changes: one takes about an hour. A
      # cache belongs to its branch, and a tag's run (the release) reads only main's: main
      # builds it, and keeps it from expiring (the schedule above).
      - uses: actions/cache@v6
        id: cache
        with:
          path: node-android/node-${{ matrix.arch }}
          key: node-android-${{ env.NODE_ANDROID }}-${{ matrix.arch }}-${{ hashFiles('apps/android/scripts/build-node.sh') }}
      - name: The Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$NDK_PACKAGE" > /dev/null
      - name: Node.js ${{ env.NODE_ANDROID }}, its source checked against nodejs.org's checksums
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO "https://nodejs.org/dist/v$NODE_ANDROID/node-v$NODE_ANDROID.tar.xz"
          curl -fsSL "https://nodejs.org/dist/v$NODE_ANDROID/SHASUMS256.txt" | grep " node-v$NODE_ANDROID.tar.xz\$" | sha256sum -c -
          tar xf "node-v$NODE_ANDROID.tar.xz"
      - name: Build it for Android
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ndk="$ANDROID_HOME/ndk/${NDK_PACKAGE#ndk;}"
          time apps/android/scripts/build-node.sh "node-v$NODE_ANDROID" "$ndk" "$ANDROID_API" ${{ matrix.arch }} node-android
          rm -rf node-android/src-*
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'schedule'
        with:
          name: node-android-${{ matrix.arch }}
          path: node-android/node-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  apk:
    name: The APKs, ${{ inputs.release && 'signed with Memora''s key' || 'for testing (debug key)' }}
    if: github.event_name != 'schedule'
    needs: node
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ inputs.release && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The server and the web app, laid out as in the desktop app
        run: |
          pnpm build
          cd apps/desktop
          pnpm build
          pnpm resources
      - name: The Android NDK, and Node.js's headers for the SQLite addon
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$NDK_PACKAGE" > /dev/null
          curl -fsSLO "https://nodejs.org/dist/v$NODE_ANDROID/node-v$NODE_ANDROID-headers.tar.gz"
          curl -fsSL "https://nodejs.org/dist/v$NODE_ANDROID/SHASUMS256.txt" | grep " node-v$NODE_ANDROID-headers.tar.gz\$" | sha256sum -c -
          tar xzf "node-v$NODE_ANDROID-headers.tar.gz"
      - uses: actions/download-artifact@v8
        with:
          pattern: node-android-*
          path: natives
          merge-multiple: true
      - name: better-sqlite3 for Android
        run: |
          ndk="$ANDROID_HOME/ndk/${NDK_PACKAGE#ndk;}"
          pkg="$(cd apps/server/node_modules/better-sqlite3 && pwd -P)"
          for arch in arm64 x86_64; do
            # A copy with its node-addon-api beside it, in a node_modules folder as Node looks for.
            rm -rf "$RUNNER_TEMP/sqlite"
            mkdir -p "$RUNNER_TEMP/sqlite"
            cp -aL "$(dirname "$pkg")" "$RUNNER_TEMP/sqlite/node_modules"
            apps/android/scripts/build-sqlite.sh "$RUNNER_TEMP/sqlite/node_modules/better-sqlite3" "$PWD/node-v$NODE_ANDROID" "$ndk" "$ANDROID_API" $arch natives
          done
      - name: Build the APKs
        env:
          # Only for a release: other runs never see the key, and sign with the debug key.
          ANDROID_KEYSTORE_BASE64: ${{ inputs.release && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ inputs.release && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ inputs.release && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ inputs.release && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          apps/android/scripts/stage.sh natives
          cd apps/android
          ./gradlew --no-daemon -Pmemora.release="$RELEASE" apks
      - name: Check the APKs' version and key, and their checksums
        env:
          # The SHA-256 of Memora's certificate (docs/SIGNING.md#android): a release signed with
          # any other key couldn't update the one before.
          CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          version="$(node -p "require('./package.json').version")"
          code="$(node --input-type=module -e "
            import { androidVersionCode } from './scripts/release-notes.mjs';
            console.log(androidVersionCode('$version'));
          ")"
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          want="$(tr -d ': ' <<< "${CERT_SHA256,,}")"
          cd apps/android/app/build/apks
          {
            echo "### Memora $version for Android (versionCode $code)"
            echo
            if [ "$RELEASE" = true ]; then
              echo "Signed with Memora's key."
            else
              echo "**For testing:** signed with this run's debug key, so these APKs install over no other build, a release's included."
            fi
            echo
            echo "| APK | Size | SHA-256 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for apk in *.apk; do
            badging="$("$tools/aapt2" dump badging "$apk" | grep '^package:')"
            echo "$apk: $badging"
            grep -q "versionCode='$code' versionName='$version'" <<< "$badging" ||
              { echo "::error::$apk isn't versionCode $code, versionName $version"; exit 1; }
            certs="$("$tools/apksigner" verify --print-certs "$apk")"
            echo "$certs"
            cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$certs")"
            if [ "$RELEASE" = true ]; then
              ! grep -q 'certificate DN: CN=Android Debug' <<< "$certs" ||
                { echo "::error::$apk is signed with a debug key"; exit 1; }
              if [ -z "$want" ]; then
                echo "::warning::Set the variable ANDROID_CERT_SHA256 to $cert, so releases check they're signed with this key (docs/SIGNING.md#android)"
              elif [ "$cert" != "$want" ]; then
                echo "::error::$apk is signed with another key than Memora's (certificate $cert): it couldn't update an earlier release"
                exit 1
              fi
            fi
            sha256sum "$apk" > "$apk.sha256"
            echo "| $apk | $(du -h "$apk" | cut -f1) | \`$(cut -d' ' -f1 "$apk.sha256")\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          ls -la
      - uses: actions/upload-artifact@v7
        with:
          name: memora-android
          path: apps/android/app/build/apks/*
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Run it on an emulator
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: memora-android
          path: apks
      # For scripts/page-visibility.mjs, which needs Node.js 22 or later for its WebSocket.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          script: apps/android/scripts/trial.sh apks/Memora-*-x86_64*.apk trial
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-trial
          path: trial
          retention-days: 14
