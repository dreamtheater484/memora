name: Release

# A version tag (`v0.9.0`) publishes that version (plan §13.3, docs/RELEASING.md):
# - the desktop app: installers for Windows, macOS and Ubuntu, each built, installed and tested
#   on its own system, signed once the signing secrets are set (docs/SIGNING.md);
# - images on GHCR for amd64 and arm64, tagged `0.9.0`, `0.9` and `latest` (a pre-release such
#   as `1.0.0-rc.1` gets its own tag only);
# - a software bill of materials (SPDX) for each architecture;
# - a GitHub release with the installers and the notes from CHANGELOG.md.
# Pull requests that change how releases are made run all of it except publishing.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - CHANGELOG.md
      - docker/**
      - scripts/check-image.mjs
      - scripts/licenses.mjs
      - scripts/release-notes.mjs
      - apps/desktop/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name == 'push' }}
  SYFT_IMAGE: anchore/syft:v1.52.0

jobs:
  prepare:
    name: Check the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.version.outputs.tags }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Version, image tags and release notes
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          # Fails unless every package.json says this version and CHANGELOG.md has its section.
          node scripts/release-notes.mjs "$version" --check > notes.md
          read -r tags prerelease < <(node --input-type=module -e "
            import { imageTags, isPrerelease } from './scripts/release-notes.mjs';
            console.log(imageTags('$version').join(','), isPrerelease('$version'));
          ")
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version as :${tags//,/, :}"
      - name: The tagged commit is on main and passed CI there
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          conclusion="$(gh run list --workflow CI --branch main --commit "$GITHUB_SHA" --event push \
            --json conclusion,status --jq '[.[] | select(.status == "completed")][0].conclusion')"
          [ "$conclusion" = success ] ||
            { echo "::error::CI on main has not passed for $GITHUB_SHA (${conclusion:-no run})"; exit 1; }
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAGS: ${{ steps.version.outputs.tags }}
        run: |
          IFS=, read -ra tags <<< "$TAGS"
          images="Images for amd64 and arm64: \`ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION\`"
          if [ "${#tags[@]}" -gt 1 ]; then
            images+=" (also"
            for tag in "${tags[@]:1}"; do images+=" \`:$tag\`"; done
            images+=")"
          fi
          docs="https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs"
          files="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          {
            echo "**Memora for your computer:** download, open, done."
            echo
            echo "- Windows: [Memora-Setup.exe]($files/Memora-Setup.exe)"
            echo "- macOS, Intel and Apple Silicon: [Memora.dmg]($files/Memora.dmg)"
            echo "- Ubuntu: [Memora-amd64.deb]($files/Memora-amd64.deb), or [Memora-arm64.deb]($files/Memora-arm64.deb) for ARM"
            echo "- Other Linux: [Memora-x86_64.AppImage]($files/Memora-x86_64.AppImage), [Memora-arm64.AppImage]($files/Memora-arm64.AppImage)"
            echo
            echo "Installing, and the first start: [DESKTOP.md]($docs/DESKTOP.md)."
            echo
            echo "**Memora Server**, for Docker and a NAS: $images. New here? Read [SETUP.md]($docs/SETUP.md). Updating? Read [UPGRADE.md]($docs/UPGRADE.md)."
            echo
            cat notes.md
          } > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  build:
    name: Build (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without publishing, the image goes to the runner's Docker for the checks below.
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.image.outputs.name) || 'type=docker,name=memora:release-check' }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: The image to check
        id: ref
        run: |
          if [ "$PUBLISH" = true ]; then
            ref="${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
            docker pull "$ref"
          else
            ref=memora:release-check
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: ./docker/smoke-test.sh "${{ steps.ref.outputs.ref }}"
      - name: Image privacy check
        run: node scripts/check-image.mjs "${{ steps.ref.outputs.ref }}"
      - name: Software bill of materials
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$SYFT_IMAGE" \
            "docker:${{ steps.ref.outputs.ref }}" -o spdx-json --quiet \
            > "memora-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.spdx.json"
          node -e "const s = require('./memora-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.spdx.json'); console.log(s.packages.length + ' packages listed')"
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.arch }}
          path: memora-*.spdx.json
          if-no-files-found: error
          retention-days: 7
      - name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: prepare
    strategy:
      # Each system's result is worth having, even when another one fails.
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: --win
          - name: macOS
            runner: macos-latest
            target: --mac
          - name: Ubuntu amd64
            runner: ubuntu-latest
            target: --linux
          - name: Ubuntu arm64
            runner: ubuntu-24.04-arm
            target: --linux
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm build
        working-directory: .
      - name: What Electron needs on Linux, and a screen for the tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64
      - name: Build the installers
        env:
          # Signing, once its secrets are set (docs/SIGNING.md), and only for a release: a pull
          # request's run never sees them. Without them, Windows is unsigned and macOS is signed
          # ad hoc, which electron-builder would skip for a pull request unless told otherwise:
          # the dry run then checks the same kind of app a release makes.
          CSC_FOR_PULL_REQUEST: 'true'
          CSC_LINK: ${{ runner.os == 'macOS' && github.event_name == 'push' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && github.event_name == 'push' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ github.event_name == 'push' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'push' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ github.event_name == 'push' && secrets.WIN_CERTIFICATE || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.WIN_CERTIFICATE_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ github.event_name == 'push' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ github.event_name == 'push' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ github.event_name == 'push' && secrets.AZURE_CLIENT_SECRET || '' }}
          MEMORA_AZURE_ENDPOINT: ${{ github.event_name == 'push' && vars.MEMORA_AZURE_ENDPOINT || '' }}
          MEMORA_AZURE_ACCOUNT: ${{ vars.MEMORA_AZURE_ACCOUNT }}
          MEMORA_AZURE_PROFILE: ${{ vars.MEMORA_AZURE_PROFILE }}
          MEMORA_AZURE_PUBLISHER: ${{ vars.MEMORA_AZURE_PUBLISHER }}
          # The Microsoft Store's identity for the app: then a Store package is built too.
          MEMORA_STORE_IDENTITY: ${{ vars.MEMORA_STORE_IDENTITY }}
          MEMORA_STORE_PUBLISHER: ${{ vars.MEMORA_STORE_PUBLISHER }}
          MEMORA_STORE_PUBLISHER_NAME: ${{ vars.MEMORA_STORE_PUBLISHER_NAME }}
        run: |
          # electron-builder takes a variable that is set but empty as a certificate's path:
          # the ones without a value are removed.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID \
            WIN_CSC_LINK WIN_CSC_KEY_PASSWORD AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            [ -n "${!name}" ] || unset "$name"
          done
          pnpm build
          pnpm resources
          pnpm app ${{ matrix.target }}
          ls -la release
      - name: Test the app
        env:
          # Outside test-results, which each Playwright run empties.
          MEMORA_SHOT: screenshots/packaged.png
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a pnpm test; else pnpm test; fi
      - name: Install it, as people will, and test that
        env:
          MEMORA_SHOT: screenshots/installed.png
        run: |
          case "$RUNNER_OS" in
            Windows)
              ./release/Memora-Setup.exe //S
              # The installer starts Memora when it's done: close it for the test's own start.
              sleep 10
              taskkill //IM Memora.exe //F || true
              app="$(find "$(cygpath "$LOCALAPPDATA")/Programs" -iname Memora.exe | head -n 1)"
              [ -n "$app" ] || { echo "Memora.exe isn't installed"; exit 1; }
              app="$(cygpath -w "$app")"
              ;;
            macOS)
              hdiutil attach release/Memora.dmg -nobrowse -mountpoint "$RUNNER_TEMP/dmg"
              cp -R "$RUNNER_TEMP/dmg/Memora.app" "$RUNNER_TEMP/"
              hdiutil detach "$RUNNER_TEMP/dmg"
              codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Memora.app"
              app="$RUNNER_TEMP/Memora.app/Contents/MacOS/Memora"
              ;;
            Linux)
              sudo apt-get install -y "./release/Memora-$(dpkg --print-architecture).deb"
              app=/opt/Memora/memora
              ;;
          esac
          echo "Installed at $app"
          if [ "$RUNNER_OS" = Linux ]; then
            MEMORA_APP="$app" xvfb-run -a pnpm test
          else
            MEMORA_APP="$app" pnpm test
          fi
      - name: Screenshots of the app on ${{ matrix.name }}, and the logs of a failed test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-screenshot-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/screenshots
            apps/desktop/test-results
          retention-days: 14
      - name: The Microsoft Store package, to upload in Partner Center (docs/SIGNING.md)
        if: runner.os == 'Windows' && vars.MEMORA_STORE_IDENTITY != ''
        uses: actions/upload-artifact@v7
        with:
          name: microsoft-store-package
          path: apps/desktop/release/Memora-Store.appx
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/release/Memora-Setup.exe
            apps/desktop/release/Memora-Setup.exe.blockmap
            apps/desktop/release/Memora.dmg
            apps/desktop/release/Memora.dmg.blockmap
            apps/desktop/release/Memora-mac.zip
            apps/desktop/release/Memora-mac.zip.blockmap
            apps/desktop/release/Memora-*.deb
            apps/desktop/release/Memora-*.AppImage
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.prepare.outputs.version }}
    if: github.event_name == 'push'
    needs: [prepare, build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: '{sbom-*,release-notes}'
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: installers-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          IFS=, read -ra tags <<< "${{ needs.prepare.outputs.tags }}"
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$name:$tag"); done
          refs=()
          for digest in *; do refs+=("$name@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$name:${{ needs.prepare.outputs.version }}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [ "${{ needs.prepare.outputs.prerelease }}" = true ] && flags+=(--prerelease) || flags+=(--latest)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Memora ${{ needs.prepare.outputs.version }}" \
            --notes-file release/release-notes.md "${flags[@]}" \
            release/*.spdx.json release/Memora* release/latest*.yml
