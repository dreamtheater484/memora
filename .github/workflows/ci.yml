name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Privacy & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: every commit is scanned
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Personal-information patterns (all files)
        run: node scripts/check-forbidden.mjs
      - name: Commit identities use noreply addresses
        run: node scripts/check-git-identity.mjs --history
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --verbose

  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in what ships (§11)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Initial JavaScript within budget (§14)
        run: node scripts/bundle-size.mjs

  e2e:
    name: Visual & accessibility (Playwright)
    runs-on: ubuntu-latest
    # Same image as `pnpm test:visual`, so screenshots match the committed baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Only the web app and its workspace dependencies: the image has no
      # compiler for the server's native better-sqlite3 module.
      - run: pnpm install --frozen-lockfile --filter "@memora/web..."
      - run: pnpm --filter @memora/web test:e2e
        # The container runs as root, but GitHub's $HOME belongs to another user,
        # and Firefox won't start then.
        env:
          HOME: /root
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [privacy]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f docker/Dockerfile -t memora:ci .
      - name: Vulnerability scan (§11)
        # Fails on high or critical findings that have a fix: in the base image's packages
        # and in the Node modules inside.
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0
          image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          memora:ci
      - name: Smoke test
        run: ./docker/smoke-test.sh memora:ci
      - name: Restore drill
        run: ./docker/restore-drill.sh memora:ci
