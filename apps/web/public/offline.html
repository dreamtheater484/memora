<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Memora is offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        background: light-dark(#f6f6fb, #16161d);
        color: light-dark(#1d1d26, #ececf2);
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        box-sizing: border-box;
        text-align: center;
      }
      main {
        max-width: 26rem;
      }
      img {
        width: 4rem;
        height: 4rem;
      }
      h1 {
        font-size: 1.4rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        line-height: 1.5;
        opacity: 0.8;
      }
      a {
        display: inline-block;
        text-decoration: none;
        font: inherit;
        font-weight: 600;
        padding: 0.6rem 1.2rem;
        border: 0;
        border-radius: 0.6rem;
        background: #4f46e5;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Memora can’t be reached</h1>
      <p>
        This device has no connection to your Memora server, and the app isn’t stored here yet. It
        opens as soon as the connection is back.
      </p>
      <!-- A link to this same address: inline scripts are not allowed (§11). -->
      <a href="">Try again</a>
    </main>
  </body>
</html>
